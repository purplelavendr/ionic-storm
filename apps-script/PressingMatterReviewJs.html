  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function getLang() {
    try { return localStorage.getItem(LANG_KEY) === 'es' ? 'es' : 'en'; } catch (e) { return 'en'; }
  }
  function setLang(lang) {
    try { localStorage.setItem(LANG_KEY, lang === 'es' ? 'es' : 'en'); } catch (e) { /* private mode */ }
  }
  function tr(field, lang) {
    return (field && typeof field === 'object') ? (field[lang] || field.en) : field;
  }
  function t(key, lang, ...args) {
    const entry = STRINGS[key] || {};
    const val = entry[lang] || entry.en;
    return typeof val === 'function' ? val(...args) : val;
  }
  // Round to d decimals and drop trailing zeros ("4.40" -> "4.4").
  function fmt(n, d) {
    const p = Math.pow(10, d === undefined ? 1 : d);
    return String(Math.round(n * p) / p);
  }

  function parseNum(s) {
    let v = String(s).trim().replace(/\s/g, '');
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)) v = v.replace(/,/g, '');
    else v = v.replace(',', '.');
    v = v.replace('−', '-');
    const n = parseFloat(v);
    return isNaN(n) || !/^-?\d*\.?\d+$/.test(v) ? NaN : n;

  function practiceProblem(lang, idSuffix, prompt, difficulty, hint, answer) {
    const diffClass = { basic: 'diff-basic', medium: 'diff-medium', challenge: 'diff-challenge' }[difficulty] || 'diff-basic';
    const diffLabel = (DIFF_LABELS[lang] || DIFF_LABELS.en)[difficulty] || difficulty;
    return `
      <div class="practice-problem">
        <div class="pp-header">
          <span class="pp-num">Q</span>
          <span class="pp-difficulty ${diffClass}">● ${escapeHtml(diffLabel)}</span>
        </div>
        <div class="pp-body">
          <p><strong>${prompt}</strong></p>
          <button type="button" class="hint-btn" data-hint-target="hint-${idSuffix}">${escapeHtml(t('hintShow', lang))}</button>
          <button type="button" class="reveal-btn" data-answer-target="ans-${idSuffix}">${escapeHtml(t('revealAnswer', lang))}</button>
          <div class="hint-box" id="hint-${idSuffix}">${hint}</div>
          <div class="answer-box" id="ans-${idSuffix}">

            ${answer}
          </div>
        </div>

  // ======================================================================
  // Shared step-by-step problem engine. The first problem in a set is guided
  // (hints open); the rest are independent. A step unlocks only after the one
  // before it is correct. Number steps give targeted feedback for common
  // mistakes ("traps") before falling back to a generic message.
  // ======================================================================
  function renderStepProblems(mount, lang, problems) {
    mount.innerHTML = `
      <div class="pm-widget">
        <p class="pm-lead"><strong>${escapeHtml(t('pickProblem', lang))}</strong></p>
        <div class="pm-choices">${problems.map((p, i) => `<button type="button" class="pm-opt${i === 0 ? ' selected' : ''}" data-prob="${i}">${escapeHtml(t('problemN', lang, i + 1))}</button>`).join('')}</div>
        <div data-stage></div>
      </div>`;
    const stage = mount.querySelector('[data-stage]');

    function mountProblem(pi) {
      const p = problems[pi], guided = pi === 0;
      const table = p.table ? `
        <div class="pm-formula-label" style="margin-top:0.4rem;">${escapeHtml(tr(p.table.caption, lang))}</div>
        <table class="pm-table pm-setup"><thead><tr>${p.table.head.map(h => `<th>${escapeHtml(tr(h, lang))}</th>`).join('')}</tr></thead>
        <tbody>${p.table.rows.map(r => `<tr>${r.map(c => { const v = tr(c, lang); return `<td${v === '?' ? ' class="pm-unknown"' : ''}>${escapeHtml(v)}</td>`; }).join('')}</tr>`).join('')}</tbody></table>` : '';
      stage.innerHTML = `
        <div class="pm-mode-badge${guided ? ' guided' : ''}">${escapeHtml(t(guided ? 'guidedModeLabel' : 'independentModeLabel', lang))}</div>
        <p style="margin:0.2rem 0 0.4rem;"><strong>${escapeHtml(tr(p.prompt, lang))}</strong></p>
        ${table}
        <div data-steps></div>
        <div data-end></div>`;
      const stepsHost = stage.querySelector('[data-steps]');
      stepsHost.innerHTML = p.steps.map((s, i) => `
        <div class="pm-step${i === 0 ? '' : ' locked'}" data-step="${i}">
          <div class="pm-step-title">${i + 1}. ${escapeHtml(tr(s.title, lang))}</div>
          ${s.fields
            ? `<div class="pm-fields">${s.fields.map((f, fi) => `<label class="pm-field">${escapeHtml(tr(f.label, lang))} <input type="text" inputmode="decimal" data-f="${fi}" autocomplete="off"> ${escapeHtml(tr(f.unit, lang))}</label>`).join('')}</div>`
            : `<div class="pm-mc">${s.choices.map((c, ci) => `<button type="button" data-c="${ci}">${escapeHtml(tr(c, lang))}</button>`).join('')}</div>`}
          <div class="pm-hint${guided ? ' open' : ''}" data-hint>${escapeHtml(tr(s.hint, lang))}</div>
          <div>${s.fields ? `<button type="button" class="pm-btn" data-check>${escapeHtml(t('check', lang))}</button> ` : ''}${guided ? '' : `<button type="button" class="pm-btn secondary" data-hbtn>${escapeHtml(t('showHint', lang))}</button>`}</div>
          <div class="pm-msg" data-msg></div>
        </div>`).join('');

      function finishStep(i) {
        const card = stepsHost.querySelector(`[data-step="${i}"]`);
        card.classList.add('done');
        const msg = card.querySelector('[data-msg]');
        msg.className = 'pm-msg ok';
        msg.textContent = t('right', lang);
        card.querySelectorAll('input,button[data-c],[data-check]').forEach(e => { e.disabled = true; });
        if (i + 1 < p.steps.length) {
          stepsHost.querySelector(`[data-step="${i + 1}"]`).classList.remove('locked');
          return;
        }
        const end = stage.querySelector('[data-end]');
        const label = pi + 1 < problems.length ? t('nextProblem', lang) : t('startOver', lang);
        end.innerHTML = `<div class="pm-solved">${escapeHtml(tr(p.done, lang))}</div><p style="margin-top:0.6rem;"><button type="button" class="pm-btn" data-nextprob>${escapeHtml(label)}</button></p>`;
        end.querySelector('[data-nextprob]').addEventListener('click', () => pickProblem((pi + 1) % problems.length));
      }

      p.steps.forEach((s, i) => {
        const card = stepsHost.querySelector(`[data-step="${i}"]`);
        const msg = card.querySelector('[data-msg]');
        const hbtn = card.querySelector('[data-hbtn]');
        if (hbtn) hbtn.addEventListener('click', () => {
          const open = card.querySelector('[data-hint]').classList.toggle('open');
          hbtn.textContent = open ? t('hideHint', lang) : t('showHint', lang);
        });
        const fail = (text) => { msg.className = 'pm-msg bad'; msg.textContent = text; };
        if (s.fields) {
          const run = () => {
            const vals = s.fields.map((f, fi) => parseNum(card.querySelector(`[data-f="${fi}"]`).value));
            if (vals.some(isNaN)) { fail(t('needNum', lang)); return; }
            if (s.fields.every((f, fi) => closeTo(vals[fi], f.answer, f.rel === undefined ? 0.02 : f.rel, f.abs))) { finishStep(i); return; }
            const trap = (s.traps || []).find(tp => closeTo(vals[tp.field || 0], tp.value, 0.01, tp.abs));
            fail(trap ? tr(trap.msg, lang) : t('wrongGeneric', lang));
          };
          card.querySelector('[data-check]').addEventListener('click', run);
          card.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); }));
        } else {
          card.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
            if (Number(b.getAttribute('data-c')) === s.correct) { b.classList.add('right'); finishStep(i); }
            else { b.classList.add('wrong'); b.disabled = true; fail(tr(s.wrong, lang)); }
          }));
        }
      });
    }

    function pickProblem(i) {
      mount.querySelectorAll('[data-prob]').forEach(b => b.classList.toggle('selected', Number(b.getAttribute('data-prob')) === i));
      mountProblem(i);
    }
    mount.querySelectorAll('[data-prob]').forEach(b => b.addEventListener('click', () => pickProblem(Number(b.getAttribute('data-prob')))));
    mountProblem(0);
  }

  function renderSublimeWidget(mount, lang) {
    const X = SUB_TXT[lang];
    mount.innerHTML = `
      <div class="pm-widget">
        <label style="font-size:0.85rem;">${escapeHtml(X.slider)}: <strong data-pct></strong></label>
        <input type="range" data-p min="0" max="100" step="5" value="0">
        <div class="pm-stage" style="margin-top:0.5rem;">
          <div data-art></div>
          <div class="pm-panel">
            <div class="pm-formula-label">${escapeHtml(X.title)}</div>
            <table class="pm-table" style="margin-top:0;"><thead><tr>${X.th.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody data-rows></tbody></table>
            <div class="pm-formula" data-dens></div>
          </div>
        </div>
        <div class="pm-insight" data-insight></div>
        <p class="pm-key">${escapeHtml(X.note)}</p>
      </div>`;
    const $ = (s) => mount.querySelector(s);
    function redraw() {
      const p = Number($('[data-p]').value) / 100;
      const ms = 6 * (1 - p), mg = 6 * p, vs = ms / 1.56, vg = mg / 0.0018, total = vs + vg;
      const w = 60 + 150 * p, h = 22 + 100 * p, chunk = 34 * Math.cbrt(1 - p);
      let dots = '';
      const n = Math.round(24 * p);
      for (let i = 0; i < n; i++) {
        const fx = ((i * 0.618) % 1), fy = ((i * 0.377 + 0.13) % 1);
        dots += `<circle cx="${(120 - w / 2 + 8 + fx * (w - 16)).toFixed(1)}" cy="${(140 - h + 7 + fy * (h - 14)).toFixed(1)}" r="3" fill="#1a8c83"/>`;
      }
      $('[data-art]').innerHTML = `<svg viewBox="0 0 240 155" width="240" class="pm-svg" role="img" aria-label="${escapeHtml(X.svg)}">
        <rect x="${120 - w / 2}" y="${140 - h}" width="${w}" height="${h}" rx="${Math.min(28, h / 2)}" fill="rgba(46,196,182,0.16)" stroke="#253a52" stroke-width="2"/>
        ${dots}
        ${chunk > 1 ? `<rect x="${120 - chunk / 2}" y="${138 - chunk * 0.55}" width="${chunk}" height="${chunk * 0.55}" rx="3" fill="#dbeafe" stroke="#253a52"/>` : ''}
        <line x1="10" y1="142" x2="230" y2="142" stroke="#8a8275" stroke-width="3"/>
      </svg>`;
      $('[data-pct]').textContent = `${Math.round(p * 100)}%`;
      $('[data-rows]').innerHTML = [[X.solid, ms, vs], [X.gas, mg, vg], [X.total, 6, total]].map((r, i) =>
        `<tr><td>${i === 2 ? '<strong>' : ''}${escapeHtml(r[0])}${i === 2 ? '</strong>' : ''}</td><td>${r[1].toFixed(1)}</td><td>${r[2] < 10 ? r[2].toFixed(1) : comma(r[2])}</td></tr>`).join('');
      const d = 6 / total;
      $('[data-dens]').textContent = X.dens(d >= 0.1 ? d.toFixed(2) : d.toFixed(4));
      $('[data-insight]').textContent = p === 0 ? X.start : p === 1 ? X.end : X.mid;
    }
    $('[data-p]').addEventListener('input', redraw);
    redraw();
  }

  // Small shared SVG line-graph used by the Boyle and Gay-Lussac widgets.
  function graphSvg(o) {
    const Wd = 320, Ht = 230, ml = 46, mr = 12, mt = 12, mb = 36;
    const pw = Wd - ml - mr, ph = Ht - mt - mb;
    const sx = (v) => ml + (v - o.xMin) / (o.xMax - o.xMin) * pw, sy = (v) => mt + ph - v / o.yMax * ph;
    const font = 'font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5a6475"';
    let s = `<svg viewBox="0 0 ${Wd} ${Ht}" class="pm-svg" width="320" role="img" aria-label="${escapeHtml(o.xLabel + ' / ' + o.yLabel)}">`;
    o.xTicks.forEach(v => { s += `<line x1="${sx(v)}" y1="${mt}" x2="${sx(v)}" y2="${mt + ph}" stroke="#d9d3c7"/><text x="${sx(v)}" y="${mt + ph + 13}" text-anchor="middle" ${font}>${v}</text>`; });
    o.yTicks.forEach(v => { s += `<line x1="${ml}" y1="${sy(v)}" x2="${ml + pw}" y2="${sy(v)}" stroke="#d9d3c7"/><text x="${ml - 5}" y="${sy(v) + 3}" text-anchor="end" ${font}>${v}</text>`; });
    s += `<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt + ph}" stroke="#253a52" stroke-width="1.6"/><line x1="${ml}" y1="${mt + ph}" x2="${ml + pw}" y2="${mt + ph}" stroke="#253a52" stroke-width="1.6"/>`;
    s += `<text x="${ml + pw / 2}" y="${Ht - 4}" text-anchor="middle" ${font}>${escapeHtml(o.xLabel)}</text><text x="11" y="${mt + ph / 2}" transform="rotate(-90 11 ${mt + ph / 2})" text-anchor="middle" ${font}>${escapeHtml(o.yLabel)}</text>`;
    const pts = o.points.map(p => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="#1a8c83" stroke-width="3"/>`;
    s += `<circle cx="${sx(o.dot[0])}" cy="${sy(o.dot[1])}" r="6" fill="#e8384f" stroke="#fff" stroke-width="2"/>`;
    return s + '</svg>';
  }

    mount.innerHTML = `
      <div class="pm-widget">
        <div class="pm-choices">${MOL_CHALLENGES.map((c, i) => `<button type="button" class="pm-opt" data-mode="${i}">${escapeHtml(X.names(i + 1))}</button>`).join('')}<button type="button" class="pm-opt" data-mode="-1">${escapeHtml(X.free)}</button></div>

        <input type="range" data-t min="100" max="600" step="10" value="300">
        <label style="font-size:0.85rem;display:block;">${escapeHtml(X.vol)}: <strong data-vval></strong> <em data-vlock></em></label>

        <div class="pm-msg" data-msg></div>
        <div data-why></div>
        <p class="pm-key">${escapeHtml(X.note)}</p>
      </div>`;
    const $ = (s) => mount.querySelector(s);
    const cv = $('canvas'), g = cv.getContext('2d');
    const H = cv.height, R = 4;
    const boxW = () => V / 8 * (cv.width - 5); // width, and so area, is proportional to V
    const parts = Array.from({ length: 26 }, (_, i) => {
      const a = (i + 0.5) / 26 * Math.PI * 2;
      return { x: R + Math.random() * (boxW() - 2 * R), y: R + Math.random() * (H - 2 * R), ux: Math.cos(a), uy: Math.sin(a) };
    });
    const pressure = () => (T / 300) * (4 / V);

    function labels() {
      $('[data-tval]').textContent = `${T} K`;
      $('[data-vval]').textContent = `${V.toFixed(1)} L`;
      $('[data-pres]').textContent = `${X.pres}: ${pressure().toFixed(2)} atm`;
      // Ideal gas: hits per bit of wall go as speed / volume, force per hit as speed.
      $('[data-hits]').textContent = `${X.hits}: ×${(Math.sqrt(T / 300) * 4 / V).toFixed(2)}`;
      $('[data-push]').textContent = `${X.push}: ×${Math.sqrt(T / 300).toFixed(2)}`;
    }
    function frame() {
      if (!cv.isConnected) return; // section re-rendered or left the page
      if (cv.offsetParent !== null) {
        const w = boxW(), sp = 2.4 * Math.sqrt(T / 300);
        g.fillStyle = '#0d1b2a'; g.fillRect(0, 0, cv.width, H);
        g.fillStyle = '#1b2d42'; g.fillRect(0, 0, w, H);
        g.fillStyle = '#e8384f'; g.fillRect(w, 0, 5, H);
        g.fillStyle = `hsl(${Math.round(215 - 205 * (T - 100) / 500)}, 85%, 62%)`;
        parts.forEach(p => {
          if (p.x > w - R) p.x = R + Math.random() * (w - 2 * R);
          p.x += p.ux * sp; p.y += p.uy * sp;
          if (p.x < R) { p.x = R; p.ux = Math.abs(p.ux); } else if (p.x > w - R) { p.x = w - R; p.ux = -Math.abs(p.ux); }
          if (p.y < R) { p.y = R; p.uy = Math.abs(p.uy); } else if (p.y > H - R) { p.y = H - R; p.uy = -Math.abs(p.uy); }
          g.beginPath(); g.arc(p.x, p.y, R, 0, Math.PI * 2); g.fill();
        });
      }
      requestAnimationFrame(frame);
    }
    function setMode(m) {
      mode = m;
      const c = MOL_CHALLENGES[m];
      T = 300; V = 4;
      $('[data-t]').value = T; $('[data-v]').value = V;
      $('[data-t]').disabled = !!c && c.lock === 'T';
      $('[data-v]').disabled = !!c && c.lock === 'V';
      $('[data-tlock]').textContent = c && c.lock === 'T' ? X.locked : '';
      $('[data-vlock]').textContent = c && c.lock === 'V' ? X.locked : '';
      $('[data-goal]').textContent = c ? tr(c.goal, lang) : X.freeNote;
      $('[data-checkwrap]').style.display = c ? 'block' : 'none';
      $('[data-checkbox]').disabled = false;
      $('[data-msg]').textContent = ''; $('[data-why]').innerHTML = '';
      mount.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('selected', Number(b.getAttribute('data-mode')) === m));
      labels();
    }
    function askWhy() {
      const c = MOL_CHALLENGES[mode];
      const box = $('[data-why]');
      box.innerHTML = `<p style="margin:0.4rem 0;"><strong>${escapeHtml(tr(c.why, lang))}</strong></p><div class="pm-mc">${c.choices.map((ch, i) => `<button type="button" data-w="${i}">${escapeHtml(tr(ch, lang))}</button>`).join('')}</div><div class="pm-msg" data-wmsg></div>`;
      box.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
        const wm = box.querySelector('[data-wmsg]');
        if (Number(b.getAttribute('data-w')) !== c.correct) { b.classList.add('wrong'); b.disabled = true; wm.className = 'pm-msg bad'; wm.textContent = X.wrongWhy; return; }
        b.classList.add('right');
        box.querySelectorAll('[data-w]').forEach(x => { x.disabled = true; });
        wm.className = 'pm-msg ok'; wm.textContent = X.done;
      }));
    }
    $('[data-t]').addEventListener('input', (e) => { T = Number(e.target.value); labels(); });
    $('[data-v]').addEventListener('input', (e) => { V = Number(e.target.value); labels(); });
    $('[data-checkbox]').addEventListener('click', () => {
      const c = MOL_CHALLENGES[mode], msg = $('[data-msg]');
      if (Math.abs(pressure() - c.target) > 0.02) { msg.className = 'pm-msg bad'; msg.textContent = X.notYet(pressure().toFixed(2), c.target.toFixed(2)); return; }
      msg.className = 'pm-msg ok'; msg.textContent = X.reached;
      $('[data-checkbox]').disabled = true;
      $('[data-t]').disabled = true; $('[data-v]').disabled = true;
      askWhy();
    });
    mount.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(Number(b.getAttribute('data-mode')))));
    setMode(0);
    requestAnimationFrame(frame);
  }

  function renderSpotMistake(mount, lang) {
    const X = SPOT_TXT[lang];
    let idx = 0;
    function show() {
      const it = SPOT_ITEMS[idx];
      mount.innerHTML = `
        <div class="pm-widget">
          <div class="pm-mode-badge">${escapeHtml(X.item(idx + 1, SPOT_ITEMS.length))}</div>
          <p style="margin:0.2rem 0;"><strong>${escapeHtml(X.problem)}:</strong> ${escapeHtml(tr(it.problem, lang))}</p>
          <p class="pm-lead">${escapeHtml(X.pick)}</p>
          <div class="pm-work">${it.lines.map((l, i) => `<button type="button" class="pm-line" data-line="${i}">${escapeHtml(l.replace('Use Boyle\'s law:', lang === 'es' ? 'Usar ley de Boyle:' : 'Use Boyle\'s law:'))}</button>`).join('')}</div>
          <div class="pm-msg" data-msg></div>
          <div data-why></div>
          <p data-nextwrap style="display:none;margin-top:0.6rem;"><button type="button" class="pm-btn" data-next></button></p>
        </div>`;
      const msg = mount.querySelector('[data-msg]');
      mount.querySelectorAll('[data-line]').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.getAttribute('data-line'));
        if (i !== it.err) { b.classList.add('picked-wrong'); b.disabled = true; msg.className = 'pm-msg bad'; msg.textContent = X.wrong; return; }
        mount.querySelectorAll('[data-line]').forEach(x => { x.disabled = true; });
        b.classList.remove('picked-wrong'); b.classList.add('error');
        msg.className = 'pm-msg ok'; msg.textContent = X.right;
        mount.querySelector('[data-why]').innerHTML = `<div class="pm-solved" style="font-weight:400;color:var(--text);">${escapeHtml(tr(it.why, lang))}</div>`;
        mount.querySelector('[data-nextwrap]').style.display = 'block';
        const nb = mount.querySelector('[data-next]');
        nb.textContent = idx + 1 < SPOT_ITEMS.length ? t('next', lang) : t('startOver', lang);
        nb.addEventListener('click', () => { idx = (idx + 1) % SPOT_ITEMS.length; show(); });
      }));
    }
    show();
  }

          <p>Para una cantidad dada de gas: <strong>P × V ÷ T = k</strong>, así que P₁V₁ ÷ T₁ = P₂V₂ ÷ T₂ (T en kelvin). Si una variable no cambia, se cancela y obtienes una de las leyes más simples.</p>
        </div>
        <table>
          <thead><tr><th>Ley</th><th>No cambia</th><th>Ecuación</th><th>Relación</th></tr></thead>
          <tbody>
            <tr><td>Boyle</td><td>T</td><td>k = P × V</td><td>inversa</td></tr>
            <tr><td>Charles</td><td>P</td><td>k = V ÷ T</td><td>directa</td></tr>
            <tr><td>Gay-Lussac</td><td>V</td><td>k = P ÷ T</td><td>directa</td></tr>
            <tr><td>Combinada</td><td>solo la cantidad de gas</td><td>k = P × V ÷ T</td><td>—</td></tr>
          </tbody>
        </table>
        <h3>Elige la ley correcta</h3>
        <div id="pm-law-mount"></div>`
      }
    },
    // ---------------------------------------------------------------- 7
    {
      title: L('Solve It: Gas Law Problems', 'Resuélvelo: Problemas de Gases'),
      time: L('15 min', '15 min'),
      bodyHtml: {
        en: `
        ${focus('en')}
        <h2>The Same Steps Every Time</h2>
        <ol>
          <li><strong>Set up</strong> the before and after values and mark the unknown with <strong>?</strong></li>
          <li>Decide <strong>what stays the same</strong> — that picks the law.</li>
          <li>Change every <strong>°C to K</strong>.</li>
          <li>Find <strong>k</strong> from the complete column.</li>
          <li><strong>Use k</strong> to find the unknown, then check that the answer makes sense.</li>
        </ol>
        <p>Problem 1 is guided. Do 2–5 on your own; problem 5 is a table problem.</p>
        <div id="pm-solver-mount"></div>
        <div class="note-box">
          <span class="note-icon">📝</span>
          <div class="note-text">Keep k unrounded (or keep at least three digits) until your final answer. P₁V₁ ÷ T₁ = P₂V₂ ÷ T₂ is the same method written in one line: both sides equal k.</div>
        </div>`,
        es: `
        ${focus('es')}
        <h2>Los Mismos Pasos Siempre</h2>
        <ol>
          <li><strong>Organiza</strong> los valores de antes y después y marca la incógnita con <strong>?</strong></li>
          <li>Decide <strong>qué se mantiene igual</strong> — eso elige la ley.</li>
          <li>Cambia todo <strong>°C a K</strong>.</li>
          <li>Encuentra <strong>k</strong> con la columna completa.</li>
          <li><strong>Usa k</strong> para hallar la incógnita y comprueba que la respuesta tenga sentido.</li>
        </ol>
        <p>El problema 1 es guiado. Haz del 2 al 5 por tu cuenta; el 5 es un problema de tabla.</p>
        <div id="pm-solver-mount"></div>
        <div class="note-box">
          <span class="note-icon">📝</span>
          <div class="note-text">No redondees k (o conserva al menos tres cifras) hasta tu respuesta final. P₁V₁ ÷ T₁ = P₂V₂ ÷ T₂ es el mismo método en una sola línea: ambos lados son iguales a k.</div>
        </div>`
      }
    },
    // ---------------------------------------------------------------- 8
    {
      title: L('Explain It & Spot the Mistake', 'Explícalo y Encuentra el Error'),
      time: L('10 min', '10 min'),
      bodyHtml: {
        en: `
        ${focus('en')}
        <h2>Explain Volume and Density</h2>
        <p>A strong explanation walks the chain: <strong>molecules → collisions → volume → mass → density</strong>. Build three of them.</p>
        <div id="pm-explain-mount"></div>
        <div id="pm-write-mount"></div>
        <h2 style="margin-top:1.3rem;">Spot the Mistake</h2>
        <p>Each solution has one wrong line. Find it.</p>
        <div id="pm-spot-mount"></div>`,
        es: `
        ${focus('es')}
        <h2>Explica el Volumen y la Densidad</h2>
        <p>Una explicación fuerte sigue la cadena: <strong>moléculas → choques → volumen → masa → densidad</strong>. Construye tres.</p>
        <div id="pm-explain-mount"></div>
        <div id="pm-write-mount"></div>
        <h2 style="margin-top:1.3rem;">Encuentra el Error</h2>
        <p>Cada solución tiene una línea equivocada. Encuéntrala.</p>
        <div id="pm-spot-mount"></div>`
      }
    }
  ];

  function render(host, ctx) {
    ensureStylesInjected();
    const lang = getLang();

    const sectionsHtml = STATIC_SECTIONS.map((sec, i) => `
      <div class="section-card" id="pm-sec-${i}" data-section="${i}">
        <div class="section-header" data-toggle="${i}">
          <span class="section-num">${i === 0 ? '★' : String(i).padStart(2, '0')}</span>
          <span class="section-title">${escapeHtml(tr(sec.title, lang))}</span>
          <span class="section-time">${escapeHtml(tr(sec.time, lang))}</span>
          <span class="section-arrow">▼</span>
        </div>
        <div class="section-body">
          ${tr(sec.bodyHtml, lang)}
          <button type="button" class="mark-done-btn" data-mark-done="${i}">${escapeHtml(t('markSectionComplete', lang))}</button>
        </div>
      </div>
    `).join('');

    host.innerHTML = `
      <div class="pm-lesson">
        <div class="pm-header">
          <div class="pm-lang-toggle" role="group" aria-label="${escapeHtml(t('langToggleAria', lang))}">
            <button type="button" class="pm-lang-btn${lang === 'en' ? ' active' : ''}" data-lang="en">EN</button>
            <button type="button" class="pm-lang-btn${lang === 'es' ? ' active' : ''}" data-lang="es">ES</button>
          </div>
          <div class="pm-header-label">${escapeHtml(t('headerLabel', lang))}</div>
          <h1>${escapeHtml(ctx.activity.title)}</h1>
          <div class="pm-header-meta">${escapeHtml(t('headerMeta', lang))}</div>
        </div>
        <div class="pm-progress-wrap">
          <span class="pm-progress-label">${escapeHtml(t('progress', lang))}</span>
          <div class="pm-progress-track"><div class="pm-progress-fill" id="pm-progress-fill"></div></div>
          <span class="pm-progress-count" id="pm-progress-count">${escapeHtml(t('sectionCount', lang, 0, SECTION_COUNT))}</span>
        </div>
        <main>
          ${sectionsHtml}
          <div class="section-card" id="pm-sec-${SECTION_COUNT - 1}" data-section="${SECTION_COUNT - 1}">
            <div class="section-header" data-toggle="${SECTION_COUNT - 1}">
              <span class="section-num">✓</span>
              <span class="section-title">${escapeHtml(t('checkForUnderstanding', lang))}</span>
              <span class="section-time">${escapeHtml(t('quizTimeGraded', lang))}</span>
              <span class="section-arrow">▼</span>
            </div>
            <div class="section-body">
              <div class="quiz-note">${t('quizNote', lang)}</div>
              <div id="pm-quiz-mount"></div>
            </div>
          </div>
        </main>
      </div>
    `;

    const root = host.querySelector('.pm-lesson');
    const quizIndex = SECTION_COUNT - 1;
    const completed = new Array(SECTION_COUNT).fill(false);

    function updateProgress() {
      const done = completed.filter(Boolean).length;
      const pct = Math.round((done / SECTION_COUNT) * 100);
      root.querySelector('#pm-progress-fill').style.width = pct + '%';
      root.querySelector('#pm-progress-count').textContent = t('sectionCount', lang, done, SECTION_COUNT);
    }

    function openSection(i, scroll) {
      const card = root.querySelector(`#pm-sec-${i}`);
      if (!card) return;
      card.querySelector('.section-body').classList.add('open');
      card.querySelector('.section-header').classList.add('open');
      if (scroll) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleSection(i) {
      const card = root.querySelector(`#pm-sec-${i}`);
      const body = card.querySelector('.section-body');
      const header = card.querySelector('.section-header');
      const isOpen = body.classList.contains('open');
      body.classList.toggle('open', !isOpen);
      header.classList.toggle('open', !isOpen);
    }

    root.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => toggleSection(Number(el.getAttribute('data-toggle'))));
    });

    root.querySelectorAll('[data-mark-done]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.getAttribute('data-mark-done'));
        if (completed[i]) return;
        completed[i] = true;
        root.querySelector(`#pm-sec-${i}`).classList.add('done');
        btn.textContent = t('sectionComplete', lang);
        btn.disabled = true;
        updateProgress();
        setTimeout(() => openSection(i + 1, true), 250);
      });
    });

    root.querySelectorAll('[data-hint-target]').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = root.querySelector('#' + btn.getAttribute('data-hint-target'));
        const open = box.classList.toggle('open');
        btn.textContent = open ? t('hintHide', lang) : t('hintShow', lang);
      });
    });
    root.querySelectorAll('[data-answer-target]').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = root.querySelector('#' + btn.getAttribute('data-answer-target'));
        const open = box.classList.toggle('open');
        btn.textContent = open ? t('hideAnswer', lang) : t('revealAnswer', lang);
      });
    });

    root.querySelectorAll('[data-lang]').forEach(btn => {
      btn.addEventListener('click', () => {
        const newLang = btn.getAttribute('data-lang');
        if (newLang === lang) return;
        setLang(newLang);
        render(host, ctx); // full re-render; progress lives in ctx.getProgress(), untouched by language
      });
    });

    // Interactive widgets -- ungraded, session-only state.
    const stepSet = (problems) => (mount, l) => renderStepProblems(mount, l, problems);
    const mountMap = [
      ['#pm-sublime-mount', renderSublimeWidget], ['#pm-density-mount', stepSet(DENSITY_PROBLEMS)],
      ['#pm-demo-mount', renderDemoWidget], ['#pm-pressure-mount', renderPressureWidget],
      ['#pm-psolver-mount', stepSet(PRESSURE_PROBLEMS)], ['#pm-piston-mount', renderPistonWidget],
      ['#pm-rigid-mount', renderRigidWidget], ['#pm-molecule-mount', renderMoleculeWidget],
      ['#pm-altitude-mount', renderAltitudeWidget], ['#pm-law-mount', renderLawSorter],
      ['#pm-solver-mount', stepSet(GAS_PROBLEMS)], ['#pm-explain-mount', renderExplainWidget],
      ['#pm-write-mount', renderWriteWidget], ['#pm-spot-mount', renderSpotMistake]
    ];
    mountMap.forEach(([sel, fn]) => { const m = root.querySelector(sel); if (m) fn(m, lang); });

    // Quiz (final section) — graded, saved via ctx.saveProgress.
    const quizMount = root.querySelector('#pm-quiz-mount');
    renderQuiz(quizMount, ctx);

    const progress = ctx.getProgress();
    if (progress && (progress.status === 'in_progress' || progress.status === 'completed')) {
      if (progress.status === 'completed') completed[quizIndex] = true;
      openSection(quizIndex, false);
    } else {
      openSection(0, false);
    }
    updateProgress();
  }

  function renderQuiz(mount, ctx) {
    const progress = ctx.getProgress();
    if (progress && progress.status === 'completed') {
      renderQuizSummary(mount, ctx);
      return;
    }
    const answers = (progress && progress.answers) || [];
    const index = answers.length;
    if (index >= QUESTIONS.length) {
      finishQuiz(mount, ctx, answers);
      return;
    }
    renderQuizQuestion(mount, ctx, answers, index);
  }

  function renderQuizQuestion(mount, ctx, answersSoFar, index) {
    const lang = getLang();
    const q = QUESTIONS[index];
    const pct = Math.round((index / QUESTIONS.length) * 100);
    mount.innerHTML = `
      <div class="quiz-question-count">${escapeHtml(t('questionCount', lang, index + 1, QUESTIONS.length))}</div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
      <p class="quiz-prompt">${escapeHtml(tr(q.prompt, lang))}</p>
      ${q.figure ? q.figure(lang) : ''}
      <div id="pm-answer-area"></div>
      <div id="pm-feedback-area"></div>
      <button type="button" class="pm-next-btn" id="pm-next-btn" style="display:none;">${escapeHtml(t('nextQuestion', lang))}</button>
    `;

    const answerArea = mount.querySelector('#pm-answer-area');
    const feedbackArea = mount.querySelector('#pm-feedback-area');
    const nextBtn = mount.querySelector('#pm-next-btn');
    let submitted = false;

    answerArea.innerHTML = q.choices.map((choice, i) => `
      <button type="button" class="pm-choice" data-choice="${i}">${escapeHtml(tr(choice, lang))}</button>
    `).join('');

    function submit(response, btnEl) {
      if (submitted) return;
      submitted = true;

      const correct = response === q.correct;
      answerArea.querySelectorAll('.pm-choice').forEach(el => {
        el.disabled = true;
        const val = Number(el.getAttribute('data-choice'));
        if (val === q.correct) el.classList.add('selected-correct');
        else if (el === btnEl) el.classList.add('selected-incorrect');
      });

      feedbackArea.innerHTML = `
        <div class="pm-feedback ${correct ? 'correct' : 'incorrect'}">
          ${correct ? escapeHtml(t('correctPrefix', lang)) : escapeHtml(t('incorrectPrefix', lang))} ${escapeHtml(tr(q.explanation, lang))}
        </div>
      `;
      nextBtn.style.display = 'inline-block';

      const answers = answersSoFar.concat([{ questionId: q.id, response, correct }]);
      const record = {
        status: 'in_progress',
        score: answers.filter(a => a.correct).length,
        totalQuestions: QUESTIONS.length,
        answers
      };
      ctx.saveProgress(record);
    }

    answerArea.querySelectorAll('.pm-choice').forEach(btn => {
      btn.addEventListener('click', () => submit(Number(btn.getAttribute('data-choice')), btn));
    });

    nextBtn.addEventListener('click', () => renderQuiz(mount, ctx));
  }

  async function finishQuiz(mount, ctx, answers) {
    const record = {
      status: 'completed',
      score: answers.filter(a => a.correct).length,
      totalQuestions: QUESTIONS.length,
      answers
    };
    await ctx.saveProgress(record);
    renderQuizSummary(mount, ctx);
  }

  function renderQuizSummary(mount, ctx) {
    const lang = getLang();
    const progress = ctx.getProgress();
    const score = progress ? progress.score : 0;
    const code = progress && progress.code ? progress.code : '';
    const total = QUESTIONS.length;
    mount.innerHTML = `
      <div class="pm-summary">
        <div class="pm-score">${score} / ${total}</div>
        ${code
          ? `<p class="pm-code-label">${escapeHtml(t('completionCode', lang))}</p><div class="pm-code">${escapeHtml(code)}</div>`
          : `<p><button type="button" class="pm-retake-btn" id="pm-show-code-btn">${escapeHtml(t('showMyCode', lang))}</button></p>`}
        <p>${escapeHtml(t('summaryText', lang))}</p>
        <button type="button" class="pm-retake-btn" id="pm-retake-btn">${escapeHtml(t('retakeQuiz', lang))}</button>
      </div>
    `;
    // Quizzes finished before completion codes existed have none; saving the
    // already-completed record again makes Storage.saveProgress mint one.
    const showCodeBtn = mount.querySelector('#pm-show-code-btn');
    if (showCodeBtn) {
      showCodeBtn.addEventListener('click', async () => {
        showCodeBtn.disabled = true;
        await ctx.saveProgress(Object.assign({}, progress));
        renderQuizSummary(mount, ctx);
      });
    }
    mount.querySelector('#pm-retake-btn').addEventListener('click', async () => {
      await ctx.saveProgress({ status: 'in_progress', score: 0, totalQuestions: total, answers: [] });
      renderQuiz(mount, ctx);
    });
  }

  window.Activities = window.Activities || {};
  window.Activities['pressing-matter-review'] = { render };
})();

</script>
