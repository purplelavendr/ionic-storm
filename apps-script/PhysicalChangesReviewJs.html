  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function getLang() {
    return localStorage.getItem(LANG_KEY) === 'es' ? 'es' : 'en';
  }
  function setLang(lang) {
    localStorage.setItem(LANG_KEY, lang === 'es' ? 'es' : 'en');
  }
  function tr(field, lang) {
    return (field && typeof field === 'object') ? (field[lang] || field.en) : field;
  }
  function t(key, lang, ...args) {
    const entry = STRINGS[key] || {};
    const val = entry[lang] || entry.en;
    return typeof val === 'function' ? val(...args) : val;
  }
  // Round to d decimals and drop trailing zeros ("4.40" -> "4.4").
  function fmt(n, d) {
    const p = Math.pow(10, d === undefined ? 1 : d);
    return String(Math.round(n * p) / p);
  }
  function parseNum(s) {
    let v = String(s).trim().replace(/\s/g, '');
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)) v = v.replace(/,/g, '');
    else v = v.replace(',', '.');
    v = v.replace('−', '-');
    const n = parseFloat(v);
    return isNaN(n) || !/^-?\d*\.?\d+$/.test(v) ? NaN : n;
  }

  // ======================================================================
  // Widget A (Lesson 50): rain gauges -- V = base area x height, so V is
  // proportional to h; the same rain height gives different volumes.
  // ======================================================================
  const GAUGE_TXT = {
    en: {
      pick: 'Pick a rain gauge (base area):',
      names: ['Narrow · 1.5 cm²', 'Medium · 3.0 cm²', 'Wide · 5.0 cm²'],
      height: 'Rain height',
      mathLabel: 'The math for this reading',
      formula: (a, h, v) => `V = base area × height\nV = ${a} cm² × ${h} cm = ${v} mL`,

      record: 'Record this reading', clear: 'Clear table',
      th: ['Height h (cm)', 'Volume V (mL)', 'V ÷ h (mL/cm)'],
      prop: (k) => `V ÷ h is ${k} mL/cm every time — a constant. That is what "proportional" means: V = k × h (here k is just the base area).`,
      tryMore: 'Record a few different heights to see the pattern.',
      key: 'Same rain, same height — but each gauge holds a different volume. That is why meteorologists report rainfall as a height, not a volume.'

      formula: (a, h, v) => `V = área de la base × altura\nV = ${a} cm² × ${h} cm = ${v} mL`,

      tryMore: 'Registra varias alturas diferentes para ver el patrón.',
      key: 'La misma lluvia, la misma altura — pero cada pluviómetro contiene un volumen distinto. Por eso los meteorólogos reportan la lluvia como una altura, no como un volumen.'

  const GAUGE_AREAS = [1.5, 3.0, 5.0];

  function gaugeSvg(area, h) {
    const px = 15, H = 10 * px, w = Math.round(26 * Math.sqrt(area));
    const x0 = 110 - w / 2, yTop = 14, yBot = yTop + H, fillH = h * px;
    let s = `<svg viewBox="0 0 220 200" class="pc-svg" width="220" role="img">`;
    s += `<rect x="${x0}" y="${yBot - fillH}" width="${w}" height="${fillH}" fill="#2ec4b6" opacity="0.75"/>`;
    s += `<rect x="${x0}" y="${yTop}" width="${w}" height="${H}" rx="3" fill="none" stroke="#253a52" stroke-width="2"/>`;
    for (let c = 0; c <= 10; c++) {
      const y = yBot - c * px;
      s += `<line x1="${x0 - 6}" y1="${y}" x2="${x0}" y2="${y}" stroke="#253a52" stroke-width="1.5"/>`;
      if (c % 2 === 0) s += `<text x="${x0 - 9}" y="${y + 3.5}" font-size="10" text-anchor="end" fill="#5a6475" font-family="JetBrains Mono, monospace">${c}</text>`;
    }
    s += `<text x="110" y="${yBot + 18}" font-size="10.5" text-anchor="middle" fill="#253a52" font-family="JetBrains Mono, monospace">cm</text>`;
    return s + `</svg>`;
  }

  function renderGaugeWidget(mount, lang) {
    const X = GAUGE_TXT[lang];
    let ai = 1, h = 4.5, rows = [];
    mount.innerHTML = `
      <div class="pc-widget">
        <p class="pc-lead"><strong>${escapeHtml(X.pick)}</strong></p>
        <div class="pc-choices">${X.names.map((n, i) => `<button type="button" class="pc-opt${i === ai ? ' selected' : ''}" data-area="${i}">${escapeHtml(n)}</button>`).join('')}</div>
        <div class="pc-stage">
          <div data-svg></div>
          <div class="pc-panel">
            <label>${escapeHtml(X.height)}: <strong data-hval></strong></label>
            <input type="range" data-h min="0" max="10" step="0.5" value="${h}">
            <div class="pc-formula"><div class="pc-formula-label">${escapeHtml(X.mathLabel)}</div><div data-formula style="white-space:pre-line"></div></div>
            <div class="pc-compare" data-compare></div>
            <div><button type="button" class="pc-btn" data-rec>${escapeHtml(X.record)}</button> <button type="button" class="pc-btn secondary" data-clr>${escapeHtml(X.clear)}</button></div>
          </div>
        </div>
        <table class="pc-table" data-table></table>
        <div class="pc-insight" data-insight></div>
        <p class="pc-key">${escapeHtml(X.key)}</p>
      </div>`;
    const $ = (s) => mount.querySelector(s);

    function redraw() {
      const a = GAUGE_AREAS[ai], v = a * h;
      $('[data-svg]').innerHTML = gaugeSvg(a, h);
      $('[data-hval]').textContent = `${fmt(h, 1)} cm`;
      $('[data-formula]').textContent = X.formula(fmt(a, 1), fmt(h, 1), fmt(v, 2));
      $('[data-compare]').textContent = X.compare(...GAUGE_AREAS.map(x => fmt(x * h, 2)));
      let tbl = `<thead><tr>${X.th.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>`;
      tbl += rows.map(r => `<tr><td>${fmt(r.h, 1)}</td><td>${fmt(r.v, 2)}</td><td>${fmt(r.v / r.h, 2)}</td></tr>`).join('');
      $('[data-table]').innerHTML = rows.length ? tbl + '</tbody>' : '';
      $('[data-insight]').textContent = rows.length >= 2 ? X.prop(fmt(GAUGE_AREAS[ai], 1)) : (rows.length ? X.tryMore : '');
    }
    mount.querySelectorAll('[data-area]').forEach(b => b.addEventListener('click', () => {
      ai = Number(b.getAttribute('data-area')); rows = [];
      mount.querySelectorAll('[data-area]').forEach(x => x.classList.toggle('selected', x === b));
      redraw();
    }));
    $('[data-h]').addEventListener('input', (e) => { h = Number(e.target.value); redraw(); });
    $('[data-rec]').addEventListener('click', () => {
      if (h > 0 && rows.length < 6 && !rows.some(r => r.h === h)) { rows.push({ h, v: GAUGE_AREAS[ai] * h }); redraw(); }
    });
    $('[data-clr]').addEventListener('click', () => { rows = []; redraw(); });
    redraw();
  }

    function redraw() {

  const TEMP_MARKS_C = [0, 20, 37, 100, -273];

  function thermoSvg(c) {
    const lo = -50, hi = 150, y0 = 190, y1 = 12;
    const clamp = Math.max(lo, Math.min(hi, c));
    const yOf = (v) => y0 - (v - lo) / (hi - lo) * (y0 - y1);
    let s = `<svg viewBox="0 0 150 210" class="pc-svg" width="120" role="img">`;
    s += `<rect x="30" y="${y1}" width="14" height="${y0 - y1 + 6}" rx="7" fill="#fff" stroke="#253a52" stroke-width="2"/>`;
    s += `<circle cx="37" cy="${y0 + 6}" r="12" fill="#e8384f" stroke="#253a52" stroke-width="2"/>`;
    s += `<rect x="33" y="${yOf(clamp)}" width="8" height="${y0 + 6 - yOf(clamp)}" fill="#e8384f"/>`;
    [[0, '0 °C · 32 °F'], [37, '37 °C · 98.6 °F'], [100, '100 °C · 212 °F']].forEach(([v, label]) => {
      s += `<line x1="44" y1="${yOf(v)}" x2="54" y2="${yOf(v)}" stroke="#253a52" stroke-width="1.5"/><text x="58" y="${yOf(v) + 3.5}" font-size="9" fill="#253a52" font-family="JetBrains Mono, monospace">${label}</text>`;
    });
    return s + `</svg>`;
  }

  function renderTempConverter(mount, lang) {
    const X = TEMP_TXT[lang];
    let scale = 0, value = 37;
    mount.innerHTML = `
      <div class="pc-widget">
        <p class="pc-lead"><strong>${escapeHtml(X.pick)}</strong></p>
        <div class="pc-choices">${X.marks.map((m, i) => `<button type="button" class="pc-opt" data-mark="${i}">${escapeHtml(m)}</button>`).join('')}</div>
        <div class="pc-stage">
          <div data-thermo></div>
          <div class="pc-panel">
            <div><input type="text" inputmode="decimal" class="pc-input" data-val value="${value}" aria-label="temperature"></div>
            <div class="pc-choices" style="margin:0;">${X.scales.map((s, i) => `<button type="button" class="pc-opt${i === scale ? ' selected' : ''}" data-scale="${i}">${escapeHtml(s)}</button>`).join('')}</div>
            <div class="pc-results" data-results></div>
            <div class="pc-insight warn" data-warn></div>
          </div>
        </div>
        <p class="pc-key" style="font-family:'JetBrains Mono',monospace;font-style:normal;">${escapeHtml(X.rules)}</p>
      </div>`;
    const $ = (s) => mount.querySelector(s);

    function toC(v, sc) { return sc === 0 ? v : sc === 1 ? 5 / 9 * (v - 32) : v - 273; }
    function redraw() {
      const input = $('[data-val]');
      const v = parseNum(input.value);
      if (isNaN(v)) { $('[data-results]').innerHTML = `<div class="pc-result">${escapeHtml(X.invalid)}</div>`; $('[data-warn]').textContent = ''; return; }
      const c = toC(v, scale), f = 9 / 5 * c + 32, k = c + 273;
      const given = [c, f, k];
      const unit = ['°C', '°F', 'K'];
      const work = [

  function renderParticleSim(mount, lang) {
    const X = SIM_TXT[lang];
    let T = 300;
    mount.innerHTML = `
      <div class="pc-widget">
        <canvas class="pc-canvas" width="360" height="190"></canvas>
        <div class="pc-choices" style="justify-content:center;margin-top:0.7rem;">${X.presets.map((p, i) => `<button type="button" class="pc-opt" data-preset="${i}">${escapeHtml(p)}</button>`).join('')}</div>
        <label style="font-size:0.85rem;">${escapeHtml(X.temp)}: <strong data-tval></strong></label>
        <input type="range" data-t min="0" max="600" step="5" value="${T}">
        <div class="pc-compare" data-avg style="margin:0.4rem 0 0.2rem;"></div>
        <div style="font-size:0.78rem;color:var(--text-muted);">${escapeHtml(X.energy)}</div>
        <div class="pc-energy"><div class="pc-energy-fill" data-energy></div></div>
        <div class="pc-insight" data-zero></div>
        <p class="pc-key">${escapeHtml(X.note)}</p>
      </div>`;
    const $ = (s) => mount.querySelector(s);
    const cv = $('canvas'), g = cv.getContext('2d');
    const W = cv.width, H = cv.height, R = 5;
    const parts = Array.from({ length: 30 }, () => {
      const a = Math.random() * Math.PI * 2;
      return { x: R + Math.random() * (W - 2 * R), y: R + Math.random() * (H - 2 * R), ux: Math.cos(a), uy: Math.sin(a), m: 0.45 + Math.random() * 1.1 };
    });

    function label() {
      $('[data-tval]').textContent = `${T} K (${T - 273} °C)`;
      $('[data-avg]').textContent = `${X.avg}: ${fmt(Math.sqrt(T / 300), 2)}`;
      $('[data-energy]').style.width = `${Math.round(T / 600 * 100)}%`;
      $('[data-zero]').textContent = T === 0 ? X.zero : '';
    }
    function frame() {
      if (!cv.isConnected) return;
      if (cv.offsetParent !== null) {
        const sp = 2.4 * Math.sqrt(T / 300);
        g.fillStyle = '#0d1b2a'; g.fillRect(0, 0, W, H);
        const hue = Math.round(220 - 220 * (T / 600));
        g.fillStyle = `hsl(${hue}, 85%, 60%)`;
        parts.forEach(p => {
          p.x += p.ux * sp * p.m; p.y += p.uy * sp * p.m;
          if (p.x < R) { p.x = R; p.ux = Math.abs(p.ux); } else if (p.x > W - R) { p.x = W - R; p.ux = -Math.abs(p.ux); }
          if (p.y < R) { p.y = R; p.uy = Math.abs(p.uy); } else if (p.y > H - R) { p.y = H - R; p.uy = -Math.abs(p.uy); }
          g.beginPath(); g.arc(p.x, p.y, R, 0, Math.PI * 2); g.fill();
        });
      }
      requestAnimationFrame(frame);
    }
    $('[data-t]').addEventListener('input', (e) => { T = Number(e.target.value); label(); });
    mount.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
      T = [0, 273, 373][Number(b.getAttribute('data-preset'))];
      $('[data-t]').value = T; label();
    }));
    label();
    requestAnimationFrame(frame);
  }

      setupWrong: 'Esa no. Recuerda V = kT: el volumen es k por la temperatura, así que la temperatura es el volumen dividido entre k.',
      choices: {
        V2: ['V₂ = k ÷ T₂', 'V₂ = k × T₂', 'V₂ = T₂ ÷ k'],
        T2: ['T₂ = k × V₂', 'T₂ = V₂ ÷ k', 'T₂ = k ÷ V₂']
      },
      solvedV: (k, v, u, dir, dir2) => `✓ ¡Resuelto! k = ${k} ${u}/K, así que V₂ = ${k} × T₂ = ${v} ${u}. Verificación: el gas ${dir}, así que el volumen debe ${dir2} — y así fue.`,
      dirUp: 'se calentó', dirDown: 'se enfrió', dir2Up: 'aumentar', dir2Down: 'disminuir',
      solvedT: (k, u, tk, c) => `✓ ¡Resuelto! k = ${k} ${u}/K, así que T₂ = V₂ ÷ k = ${tk} K = ${c} °C. Un volumen mayor necesitó una temperatura más alta.`
    }
  };

  function solveProblem(p) {
    const T1K = p.T1 + 273, k = p.V1 / T1K;
    const base = { T1K, k, kFlip: T1K / p.V1, kC: p.T1 !== 0 ? p.V1 / p.T1 : null };
    if (p.kind === 'V2') {
      const T2K = p.T2 + 273;
      return Object.assign(base, { T2K, V2: k * T2K, usedC: base.kC !== null ? base.kC * p.T2 : null, divided: k / T2K });
    }
    const T2K = p.V2 / k;
    return Object.assign(base, { T2K, T2C: T2K - 273, multiplied: p.V2 * k });
  }
  const closeTo = (a, b, rel, abs) => Math.abs(a - b) <= Math.max(abs || 0, Math.abs(b) * (rel || 0));

  function renderCharlesSolver(mount, lang) {
    const X = SOLVER_TXT[lang];
    mount.innerHTML = `
      <div class="pc-widget">
        <p class="pc-lead"><strong>${escapeHtml(X.pick)}</strong></p>
        <div class="pc-choices">${CHARLES_PROBLEMS.map((p, i) => `<button type="button" class="pc-opt${i === 0 ? ' selected' : ''}" data-prob="${i}">${escapeHtml(X.probLabel(i + 1))}</button>`).join('')}</div>
        <div data-stage></div>
      </div>`;
    const stage = mount.querySelector('[data-stage]');

    function mountProblem(pi) {
      const p = CHARLES_PROBLEMS[pi], sol = solveProblem(p), guided = pi === 0;
      const isV = p.kind === 'V2';
      const kUnit = `${p.vu}/K`;
      const steps = [];
      steps.push({
        key: 'convT', title: X.stepTitles.convT, hint: X.hints.convT, type: 'num',
        fields: isV ? [{ id: 'T1', label: X.fieldLabels.T1, unit: 'K' }, { id: 'T2', label: X.fieldLabels.T2, unit: 'K' }] : [{ id: 'T1', label: X.fieldLabels.T1, unit: 'K' }],
        check(v) {
          const exp = isV ? [sol.T1K, sol.T2K] : [sol.T1K], given = isV ? [p.T1, p.T2] : [p.T1];
          if (exp.every((e, i) => Math.abs(v[i] - e) <= 1)) return { ok: true };
          if (v.some((x, i) => x === given[i] && given[i] !== exp[i])) return { ok: false, msg: X.stillC };
          return { ok: false, msg: X.wrongGeneric };
        }
      });
      steps.push({
        key: 'findK', title: X.stepTitles.findK, hint: X.hints.findK, type: 'num',
        fields: [{ id: 'k', label: X.fieldLabels.k, unit: kUnit }],
        check(v) {
          if (closeTo(v[0], sol.k, 0.03)) return { ok: true };
          if (closeTo(v[0], sol.kFlip, 0.05)) return { ok: false, msg: X.kFlipped };
          if (sol.kC !== null && closeTo(v[0], sol.kC, 0.03)) return { ok: false, msg: X.kC };
          return { ok: false, msg: X.wrongGeneric };
        }
      });
      const kind = isV ? 'V2' : 'T2';
      steps.push({
        key: 'setup', title: X.stepTitles.setup, hint: X.hints.setup, type: 'mc',
        choices: X.choices[kind].slice(), correct: 1, wrong: X.setupWrong
      });
      if (isV) {
        steps.push({
          key: 'solveV', title: X.stepTitles.solveV(p.vu), hint: X.hints.solveV, type: 'num',
          fields: [{ id: 'V2', label: X.fieldLabels.V2, unit: p.vu }],
          check(v) {
            if (closeTo(v[0], sol.V2, 0.012)) return { ok: true };
            if (sol.usedC !== null && closeTo(v[0], sol.usedC, 0.012)) return { ok: false, msg: X.usedC };
            if (closeTo(v[0], sol.divided, 0.05)) return { ok: false, msg: X.divided };
            return { ok: false, msg: X.wrongGeneric };
          }
        });
      } else {
        steps.push({
          key: 'solveT', title: X.stepTitles.solveT, hint: X.hints.solveT, type: 'num',
          fields: [{ id: 'T2', label: X.fieldLabels.T2, unit: 'K' }],
          check(v) {
            if (closeTo(v[0], sol.T2K, 0.006, 1)) return { ok: true };
            if (closeTo(v[0], sol.multiplied, 0.01, 1)) return { ok: false, msg: X.multiplied };
            if (closeTo(v[0], sol.T2C, 0.01, 1)) return { ok: false, msg: X.isC };
            return { ok: false, msg: X.wrongGeneric };
          }
        });
        steps.push({
          key: 'backC', title: X.stepTitles.backC, hint: X.hints.backC, type: 'num',
          fields: [{ id: 'T2', label: X.fieldLabels.T2, unit: '°C' }],
          check(v) { return closeTo(v[0], sol.T2C, 0, 1) ? { ok: true } : { ok: false, msg: X.wrongGeneric }; }
        });
      }
      // Rotate the correct choice position per problem so it is not always the same slot.
      const mcStep = steps[2];
      const good = mcStep.choices[1];
      const others = mcStep.choices.filter((_, i) => i !== 1);
      mcStep.choices = others.slice(0, p.correctIdx).concat([good], others.slice(p.correctIdx));
      mcStep.correct = p.correctIdx;

      stage.innerHTML = `
        <div class="pc-mode-badge${guided ? ' guided' : ''}">${escapeHtml(t(guided ? 'guidedModeLabel' : 'independentModeLabel', lang))}</div>
        <p style="margin:0.2rem 0 0.4rem;"><strong>${escapeHtml(tr(p.prompt, lang))}</strong></p>
        <div data-steps></div>
        <div data-end></div>`;
      const stepsHost = stage.querySelector('[data-steps]');
      stepsHost.innerHTML = steps.map((s, i) => `
        <div class="pc-step${i === 0 ? '' : ' locked'}" data-step="${i}">
          <div class="pc-step-title">${escapeHtml(s.title)}</div>
          ${s.type === 'num'
            ? `<div class="pc-fields">${s.fields.map(f => `<label class="pc-field">${escapeHtml(f.label)} <input type="text" inputmode="decimal" data-f="${f.id}" autocomplete="off"> ${escapeHtml(f.unit)}</label>`).join('')}</div>`
            : `<div class="pc-mc">${s.choices.map((c, ci) => `<button type="button" data-c="${ci}">${escapeHtml(c)}</button>`).join('')}</div>`}
          <div class="pc-hint${guided ? ' open' : ''}" data-hint>${escapeHtml(s.hint)}</div>
          <div>${s.type === 'num' ? `<button type="button" class="pc-btn" data-check>${escapeHtml(X.check)}</button> ` : ''}${guided ? '' : `<button type="button" class="pc-btn secondary" data-hbtn>${escapeHtml(X.showHint)}</button>`}</div>
          <div class="pc-msg" data-msg></div>
        </div>`).join('');

      function finishStep(i) {
        const card = stepsHost.querySelector(`[data-step="${i}"]`);
        card.classList.add('done');
        card.querySelector('[data-msg]').className = 'pc-msg ok';
        card.querySelector('[data-msg]').textContent = X.right;
        card.querySelectorAll('input,button[data-c],[data-check]').forEach(e => { e.disabled = true; });
        if (i + 1 < steps.length) {
          stepsHost.querySelector(`[data-step="${i + 1}"]`).classList.remove('locked');
        } else {
          const end = stage.querySelector('[data-end]');
          const up = isV ? sol.V2 > p.V1 : true;
          const kTxt = fmt(sol.k, 2);
          const msg = isV
            ? X.solvedV(kTxt, Math.round(sol.V2).toLocaleString('en-US'), p.vu, up ? X.dirUp : X.dirDown, up ? X.dir2Up : X.dir2Down)
            : X.solvedT(kTxt, p.vu, fmt(sol.T2K, 0), fmt(sol.T2C, 0));
          const nextLabel = pi + 1 < CHARLES_PROBLEMS.length ? X.next : X.again;
          end.innerHTML = `<div class="pc-solved">${escapeHtml(msg)}</div><p style="margin-top:0.6rem;"><button type="button" class="pc-btn" data-nextprob>${escapeHtml(nextLabel)}</button></p>`;
          end.querySelector('[data-nextprob]').addEventListener('click', () => pickProblem((pi + 1) % CHARLES_PROBLEMS.length));
        }
      }

      steps.forEach((s, i) => {
        const card = stepsHost.querySelector(`[data-step="${i}"]`);
        const msg = card.querySelector('[data-msg]');
        const hbtn = card.querySelector('[data-hbtn]');
        if (hbtn) hbtn.addEventListener('click', () => {
          const open = card.querySelector('[data-hint]').classList.toggle('open');
          hbtn.textContent = open ? X.hideHint : X.showHint;
        });
        if (s.type === 'num') {
          const run = () => {
            const vals = s.fields.map(f => parseNum(card.querySelector(`[data-f="${f.id}"]`).value));
            if (vals.some(isNaN)) { msg.className = 'pc-msg bad'; msg.textContent = X.needNum; return; }
            const res = s.check(vals);
            if (res.ok) finishStep(i); else { msg.className = 'pc-msg bad'; msg.textContent = res.msg; }
          };
          card.querySelector('[data-check]').addEventListener('click', run);
          card.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); }));
        } else {
          card.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
            const ci = Number(b.getAttribute('data-c'));
            if (ci === s.correct) { b.classList.add('right'); finishStep(i); }
            else { b.classList.add('wrong'); b.disabled = true; msg.className = 'pc-msg bad'; msg.textContent = s.wrong; }
          }));
        }
      });
    }

    function pickProblem(i) {
      mount.querySelectorAll('[data-prob]').forEach(b => b.classList.toggle('selected', Number(b.getAttribute('data-prob')) === i));
      mountProblem(i);
    }
    mount.querySelectorAll('[data-prob]').forEach(b => b.addEventListener('click', () => pickProblem(Number(b.getAttribute('data-prob')))));
    mountProblem(0);
  }

  function render(host, ctx) {
    ensureStylesInjected();
    const lang = getLang();

    const sectionsHtml = STATIC_SECTIONS.map((sec, i) => `
      <div class="section-card" id="pc-sec-${i}" data-section="${i}">
        <div class="section-header" data-toggle="${i}">
          <span class="section-num">${i === 0 ? '★' : String(i).padStart(2, '0')}</span>
          <span class="section-title">${escapeHtml(tr(sec.title, lang))}</span>
          <span class="section-time">${escapeHtml(tr(sec.time, lang))}</span>
          <span class="section-arrow">▼</span>
        </div>
        <div class="section-body">
          ${tr(sec.bodyHtml, lang)}
          <button type="button" class="mark-done-btn" data-mark-done="${i}">${escapeHtml(t('markSectionComplete', lang))}</button>
        </div>
      </div>
    `).join('');

    host.innerHTML = `
      <div class="pc-lesson">
        <div class="pc-header">
          <div class="pc-lang-toggle" role="group" aria-label="${escapeHtml(t('langToggleAria', lang))}">
            <button type="button" class="pc-lang-btn${lang === 'en' ? ' active' : ''}" data-lang="en">EN</button>
            <button type="button" class="pc-lang-btn${lang === 'es' ? ' active' : ''}" data-lang="es">ES</button>
          </div>
          <div class="pc-header-label">${escapeHtml(t('headerLabel', lang))}</div>
          <h1>${escapeHtml(ctx.activity.title)}</h1>
          <div class="pc-header-meta">${escapeHtml(t('headerMeta', lang))}</div>
        </div>
        <div class="pc-progress-wrap">
          <span class="pc-progress-label">${escapeHtml(t('progress', lang))}</span>
          <div class="pc-progress-track"><div class="pc-progress-fill" id="pc-progress-fill"></div></div>
          <span class="pc-progress-count" id="pc-progress-count">${escapeHtml(t('sectionCount', lang, 0, SECTION_COUNT))}</span>
        </div>
        <main>
          ${sectionsHtml}
          <div class="section-card" id="pc-sec-${SECTION_COUNT - 1}" data-section="${SECTION_COUNT - 1}">
            <div class="section-header" data-toggle="${SECTION_COUNT - 1}">
              <span class="section-num">✓</span>
              <span class="section-title">${escapeHtml(t('checkForUnderstanding', lang))}</span>
              <span class="section-time">${escapeHtml(t('quizTimeGraded', lang))}</span>
              <span class="section-arrow">▼</span>
            </div>
            <div class="section-body">
              <div class="quiz-note">${t('quizNote', lang)}</div>
              <div id="pc-quiz-mount"></div>
            </div>
          </div>
        </main>
      </div>
    `;

    const root = host.querySelector('.pc-lesson');
    const quizIndex = SECTION_COUNT - 1;
    const completed = new Array(SECTION_COUNT).fill(false);

    function updateProgress() {
      const done = completed.filter(Boolean).length;
      const pct = Math.round((done / SECTION_COUNT) * 100);
      root.querySelector('#pc-progress-fill').style.width = pct + '%';
      root.querySelector('#pc-progress-count').textContent = t('sectionCount', lang, done, SECTION_COUNT);
    }

    function openSection(i, scroll) {
      const card = root.querySelector(`#pc-sec-${i}`);
      if (!card) return;
      card.querySelector('.section-body').classList.add('open');
      card.querySelector('.section-header').classList.add('open');
      if (scroll) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleSection(i) {
      const card = root.querySelector(`#pc-sec-${i}`);
      const body = card.querySelector('.section-body');
      const header = card.querySelector('.section-header');
      const isOpen = body.classList.contains('open');
      body.classList.toggle('open', !isOpen);
      header.classList.toggle('open', !isOpen);
    }

    root.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => toggleSection(Number(el.getAttribute('data-toggle'))));
    });

    root.querySelectorAll('[data-mark-done]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.getAttribute('data-mark-done'));
        if (completed[i]) return;
        completed[i] = true;
        root.querySelector(`#pc-sec-${i}`).classList.add('done');
        btn.textContent = t('sectionComplete', lang);
        btn.disabled = true;
        updateProgress();
        setTimeout(() => openSection(i + 1, true), 250);
      });
    });

    root.querySelectorAll('[data-hint-target]').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = root.querySelector('#' + btn.getAttribute('data-hint-target'));
        const open = box.classList.toggle('open');
        btn.textContent = open ? t('hintHide', lang) : t('hintShow', lang);
      });
    });
    root.querySelectorAll('[data-answer-target]').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = root.querySelector('#' + btn.getAttribute('data-answer-target'));
        const open = box.classList.toggle('open');
        btn.textContent = open ? t('hideAnswer', lang) : t('revealAnswer', lang);
      });
    });

    root.querySelectorAll('[data-lang]').forEach(btn => {
      btn.addEventListener('click', () => {
        const newLang = btn.getAttribute('data-lang');
        if (newLang === lang) return;
        setLang(newLang);
        render(host, ctx); // full re-render; progress lives in ctx.getProgress(), untouched by language
      });
    });

    // Interactive widgets -- ungraded, session-only state.
    const mountMap = [
      ['#pc-gauge-mount', renderGaugeWidget], ['#pc-phase-mount', renderPhaseWidget],
      ['#pc-temp-mount', renderTempConverter], ['#pc-sim-mount', renderParticleSim],
      ['#pc-balloon-mount', renderBalloonWidget], ['#pc-solver-mount', renderCharlesSolver],
      ['#pc-spot-mount', renderSpotMistake]
    ];
    mountMap.forEach(([sel, fn]) => { const m = root.querySelector(sel); if (m) fn(m, lang); });

    // Quiz (final section) — graded, saved via ctx.saveProgress.
    const quizMount = root.querySelector('#pc-quiz-mount');
    renderQuiz(quizMount, ctx);

    const progress = ctx.getProgress();
    if (progress && (progress.status === 'in_progress' || progress.status === 'completed')) {
      if (progress.status === 'completed') completed[quizIndex] = true;
      openSection(quizIndex, false);
    } else {
      openSection(0, false);
    }
    updateProgress();
  }

  function renderQuiz(mount, ctx) {
    const progress = ctx.getProgress();
    if (progress && progress.status === 'completed') {
      renderQuizSummary(mount, ctx);
      return;
    }
    const answers = (progress && progress.answers) || [];
    const index = answers.length;
    if (index >= QUESTIONS.length) {
      finishQuiz(mount, ctx, answers);
      return;
    }
    renderQuizQuestion(mount, ctx, answers, index);
  }

  function renderQuizQuestion(mount, ctx, answersSoFar, index) {
    const lang = getLang();
    const q = QUESTIONS[index];
    const pct = Math.round((index / QUESTIONS.length) * 100);
    mount.innerHTML = `
      <div class="quiz-question-count">${escapeHtml(t('questionCount', lang, index + 1, QUESTIONS.length))}</div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
      <p class="quiz-prompt">${escapeHtml(tr(q.prompt, lang))}</p>
      <div id="pc-answer-area"></div>
      <div id="pc-feedback-area"></div>
      <button type="button" class="pc-next-btn" id="pc-next-btn" style="display:none;">${escapeHtml(t('nextQuestion', lang))}</button>
    `;

    const answerArea = mount.querySelector('#pc-answer-area');
    const feedbackArea = mount.querySelector('#pc-feedback-area');
    const nextBtn = mount.querySelector('#pc-next-btn');
    let submitted = false;

    answerArea.innerHTML = q.choices.map((choice, i) => `
      <button type="button" class="pc-choice" data-choice="${i}">${escapeHtml(tr(choice, lang))}</button>
    `).join('');

    function submit(response, btnEl) {
      if (submitted) return;
      submitted = true;

      const correct = response === q.correct;
      answerArea.querySelectorAll('.pc-choice').forEach(el => {
        el.disabled = true;
        const val = Number(el.getAttribute('data-choice'));
        if (val === q.correct) el.classList.add('selected-correct');
        else if (el === btnEl) el.classList.add('selected-incorrect');
      });

      feedbackArea.innerHTML = `
        <div class="pc-feedback ${correct ? 'correct' : 'incorrect'}">
          ${correct ? escapeHtml(t('correctPrefix', lang)) : escapeHtml(t('incorrectPrefix', lang))} ${escapeHtml(tr(q.explanation, lang))}
        </div>
      `;
      nextBtn.style.display = 'inline-block';

      const answers = answersSoFar.concat([{ questionId: q.id, response, correct }]);
      const record = {
        status: 'in_progress',
        score: answers.filter(a => a.correct).length,
        totalQuestions: QUESTIONS.length,
        answers
      };
      ctx.saveProgress(record);
    }

    answerArea.querySelectorAll('.pc-choice').forEach(btn => {
      btn.addEventListener('click', () => submit(Number(btn.getAttribute('data-choice')), btn));
    });

    nextBtn.addEventListener('click', () => renderQuiz(mount, ctx));
  }

  async function finishQuiz(mount, ctx, answers) {
    const record = {
      status: 'completed',
      score: answers.filter(a => a.correct).length,
      totalQuestions: QUESTIONS.length,
      answers
    };
    await ctx.saveProgress(record);
    renderQuizSummary(mount, ctx);
  }

  function renderQuizSummary(mount, ctx) {
    const lang = getLang();
    const progress = ctx.getProgress();
    const score = progress ? progress.score : 0;
    const code = progress && progress.code ? progress.code : '';
    const total = QUESTIONS.length;
    mount.innerHTML = `
      <div class="pc-summary">
        <div class="pc-score">${score} / ${total}</div>
        ${code
          ? `<p class="pc-code-label">${escapeHtml(t('completionCode', lang))}</p><div class="pc-code">${escapeHtml(code)}</div>`
          : `<p><button type="button" class="pc-retake-btn" id="pc-show-code-btn">${escapeHtml(t('showMyCode', lang))}</button></p>`}
        <p>${escapeHtml(t('summaryText', lang))}</p>
        <button type="button" class="pc-retake-btn" id="pc-retake-btn">${escapeHtml(t('retakeQuiz', lang))}</button>
      </div>
    `;
    // Quizzes finished before completion codes existed have none; saving the
    // already-completed record again makes Storage.saveProgress mint one.
    const showCodeBtn = mount.querySelector('#pc-show-code-btn');
    if (showCodeBtn) {
      showCodeBtn.addEventListener('click', async () => {
        showCodeBtn.disabled = true;
        await ctx.saveProgress(Object.assign({}, progress));
        renderQuizSummary(mount, ctx);
      });
    }
    mount.querySelector('#pc-retake-btn').addEventListener('click', async () => {
      await ctx.saveProgress({ status: 'in_progress', score: 0, totalQuestions: total, answers: [] });
      renderQuiz(mount, ctx);
    });
  }

  window.Activities = window.Activities || {};
  window.Activities['physical-changes-review'] = { render };
})();

</script>
