<script>
// Demo review activity: "Atoms & Ions Review" (registered as CONTENT activity id 'atoms-review').
//
// This is the template for future built-in reviews: a question bank, one
// question shown at a time, immediate feedback, progress saved after every
// answer (so it resumes at the right question), and a summary screen.
(function () {
  const QUESTIONS = [
    {
      id: 'q1', type: 'mc',
      prompt: 'Which subatomic particle has a negative charge?',
      choices: ['Proton', 'Neutron', 'Electron', 'Nucleus'],
      correct: 2,
      explanation: 'Electrons carry a negative charge and occupy the space around the nucleus.'
    },
    {
      id: 'q2', type: 'num',
      prompt: 'How many protons does a neutral atom of Magnesium (Mg) have?',
      correct: 12,
      explanation: "Magnesium's atomic number is 12, which equals its proton count."
    },
    {
      id: 'q3', type: 'mc',
      prompt: 'What is the charge of a neutron?',
      choices: ['Positive', 'Negative', 'Neutral', 'Variable'],
      correct: 2,
      explanation: 'Neutrons have no charge — they help hold the nucleus together.'
    },
    {
      id: 'q4', type: 'num',
      prompt: 'An atom of Oxygen (O) has 8 protons and 10 neutrons. What is its mass number?',
      correct: 18,
      explanation: 'Mass number = protons + neutrons = 8 + 10 = 18.'
    },
    {
      id: 'q5', type: 'mc',
      prompt: 'Where are protons and neutrons located in an atom?',
      choices: ['Electron cloud', 'Nucleus', 'Orbitals', 'Valence shell'],
      correct: 1,
      explanation: 'Protons and neutrons make up the small, dense nucleus at the center of the atom.'
    },
    {
      id: 'q6', type: 'num',
      prompt: 'A neutral Sodium (Na) atom has 11 protons. How many electrons does it have?',
      correct: 11,
      explanation: 'A neutral atom has equal numbers of protons and electrons.'
    },
    {
      id: 'q7', type: 'mc',
      prompt: 'An ion with a +2 charge has ___ than protons.',
      choices: ['more electrons', 'fewer electrons', 'more neutrons', 'fewer neutrons'],
      correct: 1,
      explanation: 'A positive ion has lost electrons, so it has fewer electrons than protons.'
    },
    {
      id: 'q8', type: 'num',
      prompt: 'Ca²⁺ forms when a calcium atom (20 protons) loses 2 electrons. How many electrons does the Ca²⁺ ion have?',
      correct: 18,
      explanation: '20 electrons − 2 lost = 18 electrons remaining.'
    },
    {
      id: 'q9', type: 'mc',
      prompt: 'As you move left to right across a period on the periodic table, atomic radius generally...',
      choices: ['increases', 'decreases', 'stays the same', 'becomes negative'],
      correct: 1,
      explanation: 'Increasing nuclear charge pulls electrons in more tightly, shrinking atomic radius across a period.'
    },
    {
      id: 'q10', type: 'mc',
      prompt: 'As you move down a group on the periodic table, atomic radius generally...',
      choices: ['increases', 'decreases', 'stays the same', 'doubles'],
      correct: 0,
      explanation: 'Each row down adds a new electron shell, making atoms larger.'
    }
  ];

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function render(host, ctx) {
    const progress = ctx.getProgress();
    if (progress && progress.status === 'completed') {
      renderSummary(host, ctx);
      return;
    }
    const answers = (progress && progress.answers) || [];
    const index = answers.length;
    if (index >= QUESTIONS.length) {
      finishQuiz(host, ctx, answers);
      return;
    }
    renderQuestion(host, ctx, answers, index);
  }

  function renderQuestion(host, ctx, answersSoFar, index) {
    const q = QUESTIONS[index];
    const pct = Math.round((index / QUESTIONS.length) * 100);
    host.innerHTML = `
      <h2>${escapeHtml(ctx.activity.title)}</h2>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="muted">Question ${index + 1} of ${QUESTIONS.length}</p>
      <div class="question-card">
        <p class="question-prompt">${escapeHtml(q.prompt)}</p>
        <div id="answer-area"></div>
        <div id="feedback-area"></div>
        <button id="next-btn" class="button" style="display:none;">Next Question</button>
      </div>
    `;

    const answerArea = host.querySelector('#answer-area');
    const feedbackArea = host.querySelector('#feedback-area');
    const nextBtn = host.querySelector('#next-btn');
    let submitted = false;

    if (q.type === 'mc') {
      answerArea.innerHTML = q.choices.map((choice, i) => `
        <label class="choice-row">
          <input type="radio" name="answer" value="${i}">
          ${escapeHtml(choice)}
        </label>
      `).join('');
    } else {
      answerArea.innerHTML = `
        <input type="number" id="num-answer" class="num-input" placeholder="Your answer">
        <button id="submit-num" class="button" type="button">Submit Answer</button>
      `;
    }

    function getResponse() {
      if (q.type === 'mc') {
        const checked = answerArea.querySelector('input[name="answer"]:checked');
        return checked ? Number(checked.value) : null;
      }
      const val = answerArea.querySelector('#num-answer').value;
      return val === '' ? null : Number(val);
    }

    function submit() {
      if (submitted) return;
      const response = getResponse();
      if (response === null || Number.isNaN(response)) return;
      submitted = true;

      const correct = response === q.correct;
      feedbackArea.innerHTML = `
        <p class="feedback ${correct ? 'correct' : 'incorrect'}">
          ${correct ? '✓ Correct!' : '✗ Not quite.'} ${escapeHtml(q.explanation)}
        </p>
      `;
      answerArea.querySelectorAll('input, button').forEach(el => el.disabled = true);
      nextBtn.style.display = 'inline-block';

      const answers = answersSoFar.concat([{ questionId: q.id, response, correct }]);
      const record = {
        status: 'in_progress',
        score: answers.filter(a => a.correct).length,
        totalQuestions: QUESTIONS.length,
        answers
      };
      ctx.saveProgress(record);
    }

    if (q.type === 'mc') {
      answerArea.querySelectorAll('input[name="answer"]').forEach(input => {
        input.addEventListener('change', submit);
      });
    } else {
      const numInput = answerArea.querySelector('#num-answer');
      answerArea.querySelector('#submit-num').addEventListener('click', submit);
      numInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
      });
    }

    nextBtn.addEventListener('click', () => render(host, ctx));
  }

  async function finishQuiz(host, ctx, answers) {
    const record = {
      status: 'completed',
      score: answers.filter(a => a.correct).length,
      totalQuestions: QUESTIONS.length,
      answers
    };
    await ctx.saveProgress(record);
    renderSummary(host, ctx);
  }

  function renderSummary(host, ctx) {
    const progress = ctx.getProgress();
    const score = progress ? progress.score : 0;
    const total = QUESTIONS.length;
    host.innerHTML = `
      <h2>${escapeHtml(ctx.activity.title)}</h2>
      <div class="summary-card">
        <p class="score-display">${score} / ${total}</p>
        <p class="muted">Nice work! You can retake this review any time — your most recent attempt is what's saved.</p>
        <button id="retake-btn" class="button">Retake Review</button>
      </div>
    `;
    host.querySelector('#retake-btn').addEventListener('click', async () => {
      await ctx.saveProgress({ status: 'in_progress', score: 0, totalQuestions: total, answers: [] });
      render(host, ctx);
    });
  }

  window.Activities = window.Activities || {};
  window.Activities['atoms-review'] = { render };
})();

</script>
