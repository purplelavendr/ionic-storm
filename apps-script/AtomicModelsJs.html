<script>
// "Lesson 11: Atomic Pudding — Models of the Atom" (registered as CONTENT activity id
// 'atomic-models'). Interactive version of the "Five Models of the Atom" handout and
// "The Atomic Model Through Time" transparency: every model is an animated SVG with
// colour-coded, labelled parts (red = positive, blue = negative, teal = empty space).
//
// Same accordion + graded-quiz shape as matter-review.js / elements-review.js:
// explore -> compare -> practice games (ungraded) -> graded "Check for Understanding".
// Only the quiz's score is saved via ctx.saveProgress.
//
// Supports the shared EN/ES toggle (LANG_KEY). Grading is by the answer's
// positional index, never by displayed text, so language can't affect correctness.
(function () {
  const STYLE_ID = 'pd-lesson-styles';
  const FONT_LINK_ID = 'el-lesson-fonts'; // shared with the chapter 1/2 reviews
  const LANG_KEY = 'ionicstorm_lang_v1';  // shared literal: keeps language in sync across activities

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function getLang() {
    try { return localStorage.getItem(LANG_KEY) === 'es' ? 'es' : 'en'; } catch (e) { return 'en'; }
  }
  function setLang(lang) {
    try { localStorage.setItem(LANG_KEY, lang === 'es' ? 'es' : 'en'); } catch (e) { /* ignore */ }
  }
  function tr(field, lang) {
    return (field && typeof field === 'object') ? (field[lang] || field.en) : field;
  }
  function t(key, lang, ...args) {
    const entry = STRINGS[key] || {};
    const val = entry[lang] || entry.en;
    return typeof val === 'function' ? val(...args) : val;
  }

  // ---------------------------------------------------------------- UI strings
  const STRINGS = {
    headerLabel: { en: 'Chapter 3 · A World of Particles · Lesson 11', es: 'Capítulo 3 · Un Mundo de Partículas · Lección 11' },
    headerMeta: { en: 'Interactive Handout · ~30 Minutes · Hover, tap, and watch the atoms move', es: 'Folleto Interactivo · ~30 Minutos · Pasa el cursor, toca y observa los átomos moverse' },
    langToggleAria: { en: 'Language', es: 'Idioma' },
    progress: { en: 'Progress', es: 'Progreso' },
    sectionCount: { en: (d, n) => `${d} / ${n} sections`, es: (d, n) => `${d} / ${n} secciones` },
    markSectionComplete: { en: '✓ Mark Section Complete', es: '✓ Marcar Sección como Completa' },
    sectionComplete: { en: '✓ Section Complete', es: '✓ Sección Completa' },
    checkForUnderstanding: { en: 'Check for Understanding', es: 'Comprobación de Comprensión' },
    quizTimeGraded: { en: '8 min · graded', es: '8 min · calificado' },
    quizNote: {
      en: 'Unlike the sections above, this quiz <strong>saves your score</strong> and reports it to your teacher. You can retake it any time — your most recent attempt is what\'s saved.',
      es: 'A diferencia de las secciones anteriores, este quiz <strong>guarda tu puntaje</strong> y se lo reporta a tu maestro. Puedes volver a hacerlo en cualquier momento — se guarda tu intento más reciente.'
    },
    questionCount: { en: (n, total) => `Question ${n} of ${total}`, es: (n, total) => `Pregunta ${n} de ${total}` },
    nextQuestion: { en: 'Next Question', es: 'Siguiente Pregunta' },
    correctPrefix: { en: '✓ Correct!', es: '✓ ¡Correcto!' },
    incorrectPrefix: { en: '✗ Not quite.', es: '✗ No exactamente.' },
    retakeQuiz: { en: 'Retake Quiz', es: 'Repetir el Quiz' },
    summaryText: {
      en: 'Nice work! You can retake this any time — your most recent attempt is what\'s saved and sent to your teacher.',
      es: '¡Buen trabajo! Puedes repetirlo en cualquier momento — se guarda y se envía a tu maestro tu intento más reciente.'
    },

    // section titles
    s0Title: { en: 'Meet the Models', es: 'Conoce los Modelos' },
    s1Title: { en: 'Side by Side: The Atom Through Time', es: 'Lado a Lado: El Átomo a Través del Tiempo' },
    s2Title: { en: 'Which Model Am I?', es: '¿Qué Modelo Soy?' },
    s3Title: { en: 'Label the Parts', es: 'Etiqueta las Partes' },
    s0Time: { en: '10 min', es: '10 min' },
    s1Time: { en: '6 min', es: '6 min' },
    s2Time: { en: '6 min', es: '6 min' },
    s3Time: { en: '5 min', es: '5 min' },

    // explorer
    s0Intro: {
      en: 'Scientists have pictured the atom in different ways as new evidence came in. Click a model on the timeline to see it in action. <strong>Hover over (or tap) any part</strong> of the atom to learn what it is.',
      es: 'Los científicos han imaginado el átomo de distintas maneras a medida que surgía nueva evidencia. Haz clic en un modelo de la línea de tiempo para verlo en acción. <strong>Pasa el cursor (o toca) cualquier parte</strong> del átomo para saber qué es.'
    },
    prev: { en: '← Earlier', es: '← Anterior' },
    next: { en: 'Later →', es: 'Siguiente →' },
    tour: { en: '▶ Play the timeline', es: '▶ Recorrer la línea de tiempo' },
    tourStop: { en: '■ Stop tour', es: '■ Detener recorrido' },
    animPause: { en: '❚❚ Pause motion', es: '❚❚ Pausar movimiento' },
    animPlay: { en: '▶ Resume motion', es: '▶ Reanudar movimiento' },
    highlight: { en: 'Highlight:', es: 'Resaltar:' },
    chipPos: { en: 'Positive (+)', es: 'Positivo (+)' },
    chipNeg: { en: 'Negative (−)', es: 'Negativo (−)' },
    chipSpace: { en: 'Empty space', es: 'Espacio vacío' },
    chipAll: { en: 'Show all', es: 'Mostrar todo' },
    hoverHint: { en: 'Hover over or tap a part of the atom to see what it is.', es: 'Pasa el cursor o toca una parte del átomo para ver qué es.' },
    noPos: { en: 'This model has no positive parts.', es: 'Este modelo no tiene partes positivas.' },
    noNeg: { en: 'This model has no negative parts.', es: 'Este modelo no tiene partes negativas.' },
    noSpace: { en: 'This model has no empty space.', es: 'Este modelo no tiene espacio vacío.' },
    factDivisible: { en: 'Can it be divided?', es: '¿Se puede dividir?' },
    factPositive: { en: 'Positive charge', es: 'Carga positiva' },
    factElectrons: { en: 'Electrons', es: 'Electrones' },
    factSpace: { en: 'Empty space?', es: '¿Espacio vacío?' },
    whyLabel: { en: '🔬 What led to this model?', es: '🔬 ¿Qué llevó a este modelo?' },
    splitBtn: { en: '🔨 Try to split it!', es: '🔨 ¡Intenta dividirlo!' },
    splitMsgs: {
      en: ['Still one piece! In this model, atoms have no smaller parts.', 'Nope — nothing breaks off. It’s solid all the way through.', 'It won’t budge! (In 1897, Thomson would find out that atoms actually can be divided…)'],
      es: ['¡Sigue siendo una pieza! En este modelo, los átomos no tienen partes más pequeñas.', 'No — nada se desprende. Es sólido por completo.', '¡No cede! (En 1897, Thomson descubriría que los átomos sí se pueden dividir…)']
    },
    by: { en: 'by', es: 'por' },

    // side by side
    s1Intro: {
      en: 'Here are all six models at once, drawn the same way. Notice how each new model kept some ideas and changed others — and how the evidence behind each one pushed the picture forward.',
      es: 'Aquí están los seis modelos a la vez, dibujados de la misma manera. Observa cómo cada nuevo modelo conservó algunas ideas y cambió otras — y cómo la evidencia detrás de cada uno hizo avanzar la imagen.'
    },
    legendTitle: { en: 'Color key', es: 'Clave de colores' },
    legendPos: { en: 'Positive charge', es: 'Carga positiva' },
    legendNeg: { en: 'Negative charge (electrons)', es: 'Carga negativa (electrones)' },
    legendNeutral: { en: 'No charge', es: 'Sin carga' },
    legendSpace: { en: 'Empty space', es: 'Espacio vacío' },
    cmpTitle: { en: 'Compare the models', es: 'Compara los modelos' },
    cmpModel: { en: 'Model', es: 'Modelo' },
    cmpCols: {
      en: ['Has smaller parts', 'Has a nucleus', 'Nucleus made of protons', 'Electrons in set orbits', 'Mostly empty space'],
      es: ['Tiene partes más pequeñas', 'Tiene un núcleo', 'Núcleo hecho de protones', 'Electrones en órbitas fijas', 'Mayormente espacio vacío']
    },
    cmpNote: {
      en: '✓ = yes · ✗ = no · ~ = sort of. In the cloud model the electrons are spread out in a fuzzy cloud instead of drawn as dots in empty space.',
      es: '✓ = sí · ✗ = no · ~ = más o menos. En el modelo de nube, los electrones se distribuyen en una nube difusa en vez de dibujarse como puntos en el espacio vacío.'
    },
    openInExplorer: { en: 'Open in explorer ↗', es: 'Abrir en el explorador ↗' },

    // which model am I
    s2Intro: {
      en: '<strong>1.</strong> Click a clue. <strong>2.</strong> Click the model it describes. Each model is used exactly once.',
      es: '<strong>1.</strong> Haz clic en una pista. <strong>2.</strong> Haz clic en el modelo que describe. Cada modelo se usa exactamente una vez.'
    },
    pickClue: { en: 'Pick a clue first 👆', es: 'Elige primero una pista 👆' },
    tryAgain: { en: 'Not that one — re-read the clue and look at the colors.', es: 'Ese no — vuelve a leer la pista y mira los colores.' },
    matchGood: { en: (n) => `✓ Yes — ${n}!`, es: (n) => `✓ Sí — ¡${n}!` },
    matchDone: { en: '🎉 All six matched! Head to the next section.', es: '🎉 ¡Los seis emparejados! Pasa a la siguiente sección.' },
    matchProgress: { en: (d) => `${d} / 6 matched`, es: (d) => `${d} / 6 emparejados` },

    // label game
    s3Intro: {
      en: 'A part of the atom is pulsing. What is it? Pick the right label.',
      es: 'Una parte del átomo está pulsando. ¿Qué es? Elige la etiqueta correcta.'
    },
    labelRound: { en: (n, total) => `Round ${n} of ${total}`, es: (n, total) => `Ronda ${n} de ${total}` },
    labelQ: { en: (m) => `Which part is pulsing in the ${m}?`, es: (m) => `¿Qué parte está pulsando en el ${m}?` },
    labelDone: { en: (s, n) => `You labeled ${s} of ${n} parts correctly on the first try. (This one is just practice — it isn’t graded.)`, es: (s, n) => `Etiquetaste correctamente ${s} de ${n} partes al primer intento. (Esta es solo práctica — no se califica.)` },
    labelAgain: { en: 'Play again', es: 'Jugar de nuevo' }
  };

  // ---------------------------------------------------------------- part glossary
  // pid -> hover caption + category (drives colour)
  const PARTS = {
    nucleus:  { cat: 'pos',     name: { en: 'Nucleus', es: 'Núcleo' }, desc: { en: 'The dense, positively charged center of the atom. It takes up only a tiny amount of the atom’s space.', es: 'El centro denso y con carga positiva del átomo. Ocupa solo una pequeña parte del espacio del átomo.' } },
    protons:  { cat: 'pos',     name: { en: 'Protons', es: 'Protones' }, desc: { en: 'Positively charged particles. Together they make up the nucleus.', es: 'Partículas con carga positiva. Juntas forman el núcleo.' } },
    neutron:  { cat: 'neutral', name: { en: 'Neutrons', es: 'Neutrones' }, desc: { en: 'Particles in the nucleus with no charge at all.', es: 'Partículas del núcleo sin ninguna carga.' } },
    electron: { cat: 'neg',     name: { en: 'Electron', es: 'Electrón' }, desc: { en: 'A tiny, negatively charged particle.', es: 'Una partícula diminuta con carga negativa.' } },
    fluid:    { cat: 'pos',     name: { en: 'Positive fluid (“pudding”)', es: 'Fluido positivo (“pudín”)' }, desc: { en: 'A positively charged fluid that spreads out through the whole atom. Most of the atom is made of it.', es: 'Un fluido con carga positiva que se extiende por todo el átomo. La mayor parte del átomo está hecha de él.' } },
    sphere:   { cat: 'neutral', name: { en: 'Solid sphere', es: 'Esfera sólida' }, desc: { en: 'The whole atom: one solid piece that can’t be divided into smaller parts.', es: 'El átomo completo: una sola pieza sólida que no se puede dividir en partes más pequeñas.' } },
    orbit:    { cat: 'neutral', name: { en: 'Orbit', es: 'Órbita' }, desc: { en: 'The path an electron follows around the nucleus.', es: 'El camino que sigue un electrón alrededor del núcleo.' } },
    space:    { cat: 'space',   name: { en: 'Empty space', es: 'Espacio vacío' }, desc: { en: 'Nothing but empty space between the tiny nucleus and the tiny electrons. Most of the atom is here!', es: 'Solo espacio vacío entre el diminuto núcleo y los diminutos electrones. ¡Aquí está la mayor parte del átomo!' } },
    cloud:    { cat: 'neg',     name: { en: 'Electron cloud', es: 'Nube de electrones' }, desc: { en: 'The region where electrons are likely to be found. They don’t follow one fixed path.', es: 'La región donde es probable encontrar electrones. No siguen un camino fijo.' } }
  };
  const CAT_COLOR = { pos: '#dc2626', neg: '#2563eb', space: '#0f766e', neutral: '#475569' };

  // ---------------------------------------------------------------- drawing
  const CX = 120, CY = 125;
  let uidN = 0;

  function electronG(id, motion, params) {
    return `<g class="pd-el" data-part="neg" data-pid="electron" data-id="${id}" data-m="${motion}" data-p="${params}"><circle r="6.5"/><path d="M-3 0H3"/></g>`;
  }
  function protonG(x, y) {
    return `<g class="pd-pr" data-part="pos" data-pid="protons" transform="translate(${x} ${y})"><circle r="5.6"/><path d="M-2.8 0H2.8M0 -2.8V2.8"/></g>`;
  }
  function neutronG(x, y) {
    return `<g class="pd-ne" data-part="neutral" data-pid="neutron" transform="translate(${x} ${y})"><circle r="5.6"/></g>`;
  }
  function nucleusG() {
    return `<g class="pd-nuc" data-part="pos" data-pid="nucleus"><circle cx="${CX}" cy="${CY}" r="15"/><path d="M${CX - 6} ${CY}H${CX + 6}M${CX} ${CY - 6}V${CY + 6}"/></g>`;
  }
  function spaceCircle(r) {
    return `<circle class="pd-space" data-part="space" data-pid="space" cx="${CX}" cy="${CY}" r="${r}"/>`;
  }
  function orbitEllipse(rx, ry, rot) {
    return `<ellipse class="pd-orbit" data-part="orbit" data-pid="orbit" cx="${CX}" cy="${CY}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${CX} ${CY})"/>`;
  }
  // cluster of 7 particles around the centre; kinds[i] = 'p' | 'n'
  const CLUSTER = [[0, 0], [10.5, 0], [-10.5, 0], [5.25, 9.1], [-5.25, 9.1], [5.25, -9.1], [-5.25, -9.1]];
  function cluster(kinds) {
    return CLUSTER.map((pt, i) => (kinds[i] === 'n' ? neutronG : protonG)(CX + pt[0], CY + pt[1])).join('');
  }
  function orbitPoint(rx, ry, rot, thDeg) {
    const th = thDeg * Math.PI / 180, a = rot * Math.PI / 180;
    return [CX + rx * Math.cos(th) * Math.cos(a) - ry * Math.sin(th) * Math.sin(a),
            CY + rx * Math.cos(th) * Math.sin(a) + ry * Math.sin(th) * Math.cos(a)];
  }

  // Each DRAW fn returns { body, callouts }. callout: { pid, label:{en,es}, tx, ty, ly, follow? }
  const DRAW = {
    solid(u) {
      return {
        body: `<defs><radialGradient id="${u}g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f3f4f6"/><stop offset=".55" stop-color="#9ca3af"/><stop offset="1" stop-color="#4b5563"/></radialGradient></defs>
          <g class="pd-sphere" data-part="neutral" data-pid="sphere"><circle cx="${CX}" cy="${CY}" r="80" fill="url(#${u}g)" stroke="#374151" stroke-width="3"/></g>`,
        callouts: [{ pid: 'sphere', label: { en: 'Solid\nsphere', es: 'Esfera\nsólida' }, tx: CX + 57, ty: CY - 57, ly: CY - 5 }]
      };
    },
    plum(u) {
      const base = [[-40, -45], [10, -60], [52, -30], [-62, -5], [-15, -10], [30, 10], [60, 35], [-35, 40], [8, 55]];
      const els = base.map((b, i) => electronG('e' + i, 'jig', `${CX + b[0]} ${CY + b[1]} 5 5 ${(1.5 + i * 0.17).toFixed(2)} ${(i * 0.9).toFixed(2)}`)).join('');
      return {
        body: `<defs><radialGradient id="${u}g" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#f87171" stop-opacity=".75"/></radialGradient></defs>
          <g class="pd-fluid" data-part="pos" data-pid="fluid"><circle cx="${CX}" cy="${CY}" r="95" fill="url(#${u}g)" stroke="#dc2626" stroke-opacity=".5" stroke-width="2"/></g>${els}`,
        callouts: [
          { pid: 'electron', label: { en: 'Negative\nelectron (“plum”)', es: 'Electrón\nnegativo (“ciruela”)' }, follow: 'e2', tx: CX + 52, ty: CY - 30, ly: CY - 55 },
          { pid: 'fluid', label: { en: 'Positive\nfluid (“pudding”)', es: 'Fluido positivo\n(“pudín”)' }, tx: CX + 46, ty: CY + 66, ly: CY + 50 }
        ]
      };
    },
    nuclear(u) {
      const orbs = [[0, 6, 0.1], [60, 7.5, 0.45], [120, 5.2, 0.75]];
      const ell = orbs.map(o => orbitEllipse(98, 34, o[0])).join('');
      const els = orbs.map((o, i) => electronG('e' + i, 'orbit', `${CX} ${CY} 98 34 ${o[0]} ${o[1]} ${o[2]}`)).join('');
      return {
        body: `${spaceCircle(104)}${ell}${nucleusG()}${els}`,
        callouts: [
          { pid: 'electron', label: { en: 'Negative\nelectron', es: 'Electrón\nnegativo' }, follow: 'e0', tx: CX, ty: CY, ly: CY - 55 },
          { pid: 'nucleus', label: { en: 'Positive\nnucleus', es: 'Núcleo\npositivo' }, tx: CX + 11, ty: CY + 11, ly: CY + 20 },
          { pid: 'space', label: { en: 'Empty\nspace', es: 'Espacio\nvacío' }, tx: CX + 66, ty: CY + 68, ly: CY + 78 }
        ]
      };
    },
    proton(u) {
      const orbs = [[0, 6, 0.1], [60, 7.5, 0.4], [120, 5.2, 0.7]];
      const ell = orbs.map(o => orbitEllipse(98, 34, o[0])).join('');
      const els = [[0, 0.1], [0, 0.6], [1, 0.4], [1, 0.9], [2, 0.7]].map((p, i) =>
        electronG('e' + i, 'orbit', `${CX} ${CY} 98 34 ${orbs[p[0]][0]} ${orbs[p[0]][1]} ${p[1]}`)).join('');
      return {
        body: `${spaceCircle(104)}${ell}${cluster('ppppppp')}${els}`,
        callouts: [
          { pid: 'electron', label: { en: 'Negative\nelectron', es: 'Electrón\nnegativo' }, follow: 'e0', tx: CX, ty: CY, ly: CY - 55 },
          { pid: 'protons', label: { en: 'Nucleus of\npositive protons', es: 'Núcleo de\nprotones positivos' }, tx: CX + 15, ty: CY + 8, ly: CY + 20 },
          { pid: 'space', label: { en: 'Empty\nspace', es: 'Espacio\nvacío' }, tx: CX + 66, ty: CY + 68, ly: CY + 78 }
        ]
      };
    },
    solar(u) {
      const outer = orbitPoint(90, 90, 0, 35);
      return {
        body: `${spaceCircle(104)}
          <circle class="pd-orbit" data-part="orbit" data-pid="orbit" cx="${CX}" cy="${CY}" r="52"/>
          <circle class="pd-orbit" data-part="orbit" data-pid="orbit" cx="${CX}" cy="${CY}" r="90"/>
          ${nucleusG()}
          ${electronG('e0', 'orbit', `${CX} ${CY} 52 52 0 3.4 0.05`)}${electronG('e1', 'orbit', `${CX} ${CY} 52 52 0 3.4 0.55`)}
          ${electronG('e2', 'orbit', `${CX} ${CY} 90 90 0 7.6 0.1`)}${electronG('e3', 'orbit', `${CX} ${CY} 90 90 0 7.6 0.43`)}${electronG('e4', 'orbit', `${CX} ${CY} 90 90 0 7.6 0.77`)}`,
        callouts: [
          { pid: 'electron', label: { en: 'Negative\nelectron', es: 'Electrón\nnegativo' }, follow: 'e2', tx: CX, ty: CY, ly: CY - 65 },
          { pid: 'orbit', label: { en: 'Orbit (set\ndistance)', es: 'Órbita (distancia\nfija)' }, tx: outer[0], ty: outer[1], ly: CY + 55 },
          { pid: 'nucleus', label: { en: 'Positive\nnucleus', es: 'Núcleo\npositivo' }, tx: CX + 11, ty: CY + 11, ly: CY + 5 }
        ]
      };
    },
    cloud(u) {
      const dots = [0, 1, 2, 3, 4, 5, 6, 7].map(i => electronG('e' + i, 'hop', `${i + 1}`)).join('');
      return {
        body: `<defs><radialGradient id="${u}g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#93c5fd" stop-opacity="0"/><stop offset=".16" stop-color="#93c5fd" stop-opacity=".15"/><stop offset=".45" stop-color="#3b82f6" stop-opacity=".5"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient></defs>
          <g class="pd-cloud" data-part="neg" data-pid="cloud"><circle cx="${CX}" cy="${CY}" r="104" fill="url(#${u}g)"/></g>
          ${cluster('pnpnpnp')}${dots}`,
        callouts: [
          { pid: 'cloud', label: { en: 'Negative electron\ncloud', es: 'Nube de electrones\nnegativa' }, tx: CX + 62, ty: CY - 50, ly: CY - 55 },
          { pid: 'nucleus', label: { en: 'Nucleus (protons\n+ neutrons)', es: 'Núcleo (protones\n+ neutrones)' }, tx: CX + 15, ty: CY + 6, ly: CY + 40 }
        ]
      };
    }
  };

  function atomSvg(modelId, opts) {
    opts = opts || {};
    const lang = opts.lang || 'en';
    const m = MODEL_BY_ID[modelId];
    const u = 'pd' + (++uidN);
    const d = DRAW[modelId](u);
    let callouts = '';
    if (opts.labels) {
      callouts = d.callouts.map(c => {
        const part = PARTS[c.pid];
        const col = CAT_COLOR[part.cat];
        const follow = c.follow ? ` data-follow="${c.follow}"` : '';
        const lines = tr(c.label, lang).split('\n');
        const text = lines.map((ln, i) => `<tspan x="252" dy="${i === 0 ? 0 : 14}">${escapeHtml(ln)}</tspan>`).join('');
        return `<g class="pd-callout" data-pid="${c.pid}">
          <line x1="${c.tx}" y1="${c.ty}" x2="246" y2="${c.ly}"${follow}/>
          <circle r="2.6" cx="${c.tx}" cy="${c.ty}"${follow ? ' data-follow-dot="' + c.follow + '"' : ''}/>
          <text x="252" y="${c.ly + 3}" fill="${col}">${text}</text>
        </g>`;
      }).join('');
    }
    const vb = opts.labels ? '0 0 390 250' : '12 20 216 216';
    const attrs = opts.target ? ` data-target="${opts.target}"` : '';
    return `<svg class="pd-svg" viewBox="${vb}" role="img" aria-label="${escapeHtml(tr(m.name, lang))}"${attrs}>${d.body}${callouts}</svg>`;
  }

  // ---- animation engine: generic per-element motion, driven by one rAF loop ----
  function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

  function stepAtom(svg, t) {
    const pos = {};
    svg.querySelectorAll('[data-m]').forEach(el => {
      const p = el.getAttribute('data-p').split(' ').map(Number);
      const m = el.getAttribute('data-m');
      let x, y;
      if (m === 'orbit') {
        const th = 2 * Math.PI * (t / p[5] + p[6]), a = p[4] * Math.PI / 180;
        x = p[0] + p[2] * Math.cos(th) * Math.cos(a) - p[3] * Math.sin(th) * Math.sin(a);
        y = p[1] + p[2] * Math.cos(th) * Math.sin(a) + p[3] * Math.sin(th) * Math.cos(a);
      } else if (m === 'jig') {
        x = p[0] + p[2] * Math.cos(p[4] * t + p[5]);
        y = p[1] + p[3] * Math.sin(1.31 * p[4] * t + p[5] * 1.7);
      } else { // hop: electrons blink in at a new random spot in the cloud
        const seed = p[0], per = 1.1, tt = t / per + seed * 0.37, k = Math.floor(tt), f = tt - k;
        const ang = hash(seed * 97 + k * 13) * 2 * Math.PI, rad = 26 + hash(seed * 31 + k * 57 + 7) * 62;
        x = CX + rad * Math.cos(ang); y = CY + rad * Math.sin(ang);
        el.setAttribute('opacity', (Math.sin(Math.PI * f) * 0.95).toFixed(3));
      }
      el.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
      const id = el.getAttribute('data-id');
      if (id) pos[id] = [x, y];
    });

  function createAnimator(root) {
    const targets = new Set();
    let raf = 0, acc = 0, last = 0;
    let paused = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    function frame(now) {
      if (!root.isConnected) { raf = 0; return; }
      if (last && !paused) acc += Math.min((now - last) / 1000, 0.1);
      last = now;
      targets.forEach(svg => { if (!svg.isConnected) targets.delete(svg); else stepAtom(svg, acc); });
      raf = requestAnimationFrame(frame);
    }
    return {
      add(svg) { targets.add(svg); stepAtom(svg, acc); if (!raf) raf = requestAnimationFrame(frame); },
      setPaused(p) { paused = p; },
      isPaused() { return paused; }
    };

.pd-lesson .pd-clue.selected { border-color: var(--navy); background: #f3f8ff; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
.pd-lesson .pd-clue.solved { border-color: var(--correct-border); background: var(--correct-bg); cursor: default; }
.pd-lesson .pd-clue-num { width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--navy); color: white; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pd-lesson .pd-clue.solved .pd-clue-num { background: var(--teal-dim); }
.pd-lesson .pd-clue-text { flex: 1; }
.pd-lesson .pd-clue-ans { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; font-weight: 600; color: var(--teal-dim); white-space: nowrap; }
.pd-lesson .pd-status { min-height: 1.6rem; margin: 0.4rem 0; font-size: 0.92rem; font-weight: 600; color: var(--navy); }
.pd-lesson .pd-status.bad { color: #b91c1c; } .pd-lesson .pd-status.good { color: var(--teal-dim); }

/* ---- label game ---- */
.pd-lesson .pd-lg { max-width: 520px; margin: 0 auto; }
.pd-lesson .pd-lg .pd-stagebox { background: radial-gradient(circle at 50% 40%, #fff, #f1efe9); border: 1px solid var(--cream-dark); border-radius: 12px; padding: 0.5rem; }
.pd-lesson .pd-lg .pd-svg { max-height: 300px; margin: 0 auto; }
.pd-lesson .pd-opt { display: block; width: 100%; text-align: left; margin-bottom: 0.45rem; padding: 0.6rem 0.9rem; border: 2px solid var(--cream-dark); border-radius: 10px; background: white; cursor: pointer; font-size: 0.95rem; color: var(--text); }
.pd-lesson .pd-opt:hover:not(:disabled) { border-color: var(--teal); background: #f3fdfc; }
.pd-lesson .pd-opt:disabled { cursor: default; }
.pd-lesson .pd-opt.ok { border-color: var(--correct-border); background: var(--correct-bg); }
.pd-lesson .pd-opt.no { border-color: #dc2626; background: #fef2f2; }

/* ---- quiz ---- */
.pd-lesson .quiz-note { background: #fff8e7; border-left: 4px solid var(--amber); padding: 0.7rem 0.9rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; }
.pd-lesson .quiz-progress-bar { height: 6px; background: var(--cream-dark); border-radius: 3px; overflow: hidden; margin: 0.3rem 0 1rem; }
.pd-lesson .quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--amber)); }
.pd-lesson .quiz-question-count { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.pd-lesson .quiz-prompt { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--navy); margin: 0 0 0.9rem; }
.pd-lesson .pd-choice { display: block; width: 100%; text-align: left; margin-bottom: 0.5rem; padding: 0.7rem 1rem; border: 2px solid var(--cream-dark); border-radius: 10px; background: white; cursor: pointer; font-size: 0.97rem; color: var(--text); }
.pd-lesson .pd-choice:hover:not(:disabled) { border-color: var(--teal); background: #f3fdfc; }
.pd-lesson .pd-choice:disabled { cursor: default; }
.pd-lesson .pd-choice.selected-correct { border-color: var(--correct-border); background: var(--correct-bg); }
.pd-lesson .pd-choice.selected-incorrect { border-color: #dc2626; background: #fef2f2; }
.pd-lesson .pd-feedback { margin: 0.8rem 0; padding: 0.7rem 0.9rem; border-radius: 8px; font-size: 0.92rem; }
.pd-lesson .pd-feedback.correct { background: var(--correct-bg); color: var(--teal-dim); }
.pd-lesson .pd-feedback.incorrect { background: #fef2f2; color: #b91c1c; }
.pd-lesson .pd-next-btn, .pd-lesson .pd-retake-btn { background: var(--navy); color: var(--cream); border: none; padding: 0.65rem 1.2rem; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
.pd-lesson .pd-next-btn:hover, .pd-lesson .pd-retake-btn:hover { background: var(--navy-light); }
.pd-lesson .pd-summary { text-align: center; padding: 1rem 0.5rem; }
.pd-lesson .pd-score { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700; color: var(--teal-dim); }
@media (max-width: 560px) {
  .pd-lesson .pd-header h1 { font-size: 1.5rem; }
  .pd-lesson .pd-fact { grid-template-columns: 1fr; gap: 0; }
  .pd-lesson .section-time { display: none; }
}
`;
    document.head.appendChild(style);
  }

  // ---------------------------------------------------------------- main render
  let lastModel = 0; // explorer selection survives language re-renders

  function render(host, ctx) {
    ensureStylesInjected();
    const lang = getLang();

    const titles = [t('s0Title', lang), t('s1Title', lang), t('s2Title', lang), t('s3Title', lang)];
    const times = [t('s0Time', lang), t('s1Time', lang), t('s2Time', lang), t('s3Time', lang)];
    const sectionsHtml = titles.map((title, i) => `
      <div class="section-card" id="pd-sec-${i}" data-section="${i}">
        <div class="section-header" data-toggle="${i}">
          <span class="section-num">${i === 0 ? '★' : String(i).padStart(2, '0')}</span>
          <span class="section-title">${escapeHtml(title)}</span>
          <span class="section-time">${escapeHtml(times[i])}</span>
          <span class="section-arrow">▼</span>
        </div>
        <div class="section-body">
          <div class="pd-mount" id="pd-mount-${i}"></div>
          <button type="button" class="mark-done-btn" data-mark-done="${i}">${escapeHtml(t('markSectionComplete', lang))}</button>
        </div>
      </div>`).join('');

    host.innerHTML = `
      <div class="pd-lesson">
        <div class="pd-header">
          <div class="pd-lang-toggle" role="group" aria-label="${escapeHtml(t('langToggleAria', lang))}">
            <button type="button" class="pd-lang-btn${lang === 'en' ? ' active' : ''}" data-lang="en">EN</button>
            <button type="button" class="pd-lang-btn${lang === 'es' ? ' active' : ''}" data-lang="es">ES</button>
          </div>
          <div class="pd-header-label">${escapeHtml(t('headerLabel', lang))}</div>
          <h1>${escapeHtml(ctx.activity.title)}</h1>
          <div class="pd-header-meta">${escapeHtml(t('headerMeta', lang))}</div>
        </div>
        <div class="pd-progress-wrap">
          <span class="pd-progress-label">${escapeHtml(t('progress', lang))}</span>
          <div class="pd-progress-track"><div class="pd-progress-fill" id="pd-progress-fill"></div></div>
          <span class="pd-progress-count" id="pd-progress-count">${escapeHtml(t('sectionCount', lang, 0, SECTION_COUNT))}</span>
        </div>
        <main>
          ${sectionsHtml}
          <div class="section-card" id="pd-sec-${SECTION_COUNT - 1}" data-section="${SECTION_COUNT - 1}">
            <div class="section-header" data-toggle="${SECTION_COUNT - 1}">
              <span class="section-num">✓</span>
              <span class="section-title">${escapeHtml(t('checkForUnderstanding', lang))}</span>
              <span class="section-time">${escapeHtml(t('quizTimeGraded', lang))}</span>
              <span class="section-arrow">▼</span>
            </div>
            <div class="section-body">
              <div class="quiz-note">${t('quizNote', lang)}</div>
              <div id="pd-quiz-mount"></div>
            </div>
          </div>
        </main>
      </div>`;

    const root = host.querySelector('.pd-lesson');
    const quizIndex = SECTION_COUNT - 1;
    const completed = new Array(SECTION_COUNT).fill(false);
    const anim = createAnimator(root);

    function updateProgress() {
      const done = completed.filter(Boolean).length;
      root.querySelector('#pd-progress-fill').style.width = Math.round((done / SECTION_COUNT) * 100) + '%';
      root.querySelector('#pd-progress-count').textContent = t('sectionCount', lang, done, SECTION_COUNT);
    }
    function openSection(i, scroll) {
      const card = root.querySelector(`#pd-sec-${i}`);
      if (!card) return;
      card.querySelector('.section-body').classList.add('open');
      card.querySelector('.section-header').classList.add('open');
      if (scroll) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function toggleSection(i) {
      const card = root.querySelector(`#pd-sec-${i}`);
      const open = !card.querySelector('.section-body').classList.contains('open');
      card.querySelector('.section-body').classList.toggle('open', open);
      card.querySelector('.section-header').classList.toggle('open', open);
    }
    root.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => toggleSection(Number(el.getAttribute('data-toggle')))));
    root.querySelectorAll('[data-mark-done]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.getAttribute('data-mark-done'));
        if (completed[i]) return;
        completed[i] = true;
        root.querySelector(`#pd-sec-${i}`).classList.add('done');
        btn.textContent = t('sectionComplete', lang);
        btn.disabled = true;
        updateProgress();
        setTimeout(() => openSection(i + 1, true), 250);
      });
    });
    root.querySelectorAll('[data-lang]').forEach(btn => {
      btn.addEventListener('click', () => {
        const newLang = btn.getAttribute('data-lang');
        if (newLang === lang) return;
        setLang(newLang);
        render(host, ctx); // full re-render; graded progress lives in ctx.getProgress()
      });
    });

    // Interactive sections
    const explorer = mountExplorer(root.querySelector('#pd-mount-0'), lang, anim);
    mountSideBySide(root.querySelector('#pd-mount-1'), lang, anim, (i) => { // "Open in explorer" on the cards
      openSection(0, false);
      explorer.openFromOutside(i);
    });
    mountMatchGame(root.querySelector('#pd-mount-2'), lang);
    mountLabelGame(root.querySelector('#pd-mount-3'), lang, anim);

    // Quiz (final section) — graded, saved via ctx.saveProgress.
    renderQuiz(root.querySelector('#pd-quiz-mount'), ctx);

    const progress = ctx.getProgress();
    if (progress && (progress.status === 'in_progress' || progress.status === 'completed')) {
      if (progress.status === 'completed') completed[quizIndex] = true;
      openSection(quizIndex, false);
    } else {
      openSection(0, false);
    }
    updateProgress();
  }

  // ---------------------------------------------------------------- section 0: explorer
  function mountExplorer(mount, lang, anim) {
    let sel = lastModel, hl = 'all', tourTimer = null, splitCount = 0;
    const seen = new Set([sel]);

    mount.innerHTML = `
      <p class="pd-intro">${t('s0Intro', lang)}</p>
      <div class="pd-timeline" role="tablist">
        ${MODELS.map((m, i) => `
          <button type="button" class="pd-tl-btn" role="tab" data-i="${i}">
            <span class="pd-tl-dot"></span>
            <span class="pd-tl-year">${m.year}</span>
            <span class="pd-tl-name">${escapeHtml(tr(m.short, lang))}</span>
          </button>`).join('')}
      </div>
      <div class="pd-controls">
        <button type="button" class="pd-btn" data-act="prev">${escapeHtml(t('prev', lang))}</button>
        <button type="button" class="pd-btn" data-act="next">${escapeHtml(t('next', lang))}</button>
        <button type="button" class="pd-btn" data-act="tour">${escapeHtml(t('tour', lang))}</button>
        <button type="button" class="pd-btn" data-act="pause">${escapeHtml(anim.isPaused() ? t('animPlay', lang) : t('animPause', lang))}</button>
      </div>
      <div class="pd-explorer">
        <div>
          <div class="pd-stage" id="pd-stage" data-hl="all"></div>
          <div class="pd-chips">
            <span class="pd-chips-label">${escapeHtml(t('highlight', lang))}</span>
            <button type="button" class="pd-chip" data-hl="pos">${escapeHtml(t('chipPos', lang))}</button>
            <button type="button" class="pd-chip" data-hl="neg">${escapeHtml(t('chipNeg', lang))}</button>
            <button type="button" class="pd-chip" data-hl="space">${escapeHtml(t('chipSpace', lang))}</button>
            <button type="button" class="pd-chip active" data-hl="all">${escapeHtml(t('chipAll', lang))}</button>
          </div>
          <div class="pd-caption" id="pd-caption"></div>
        </div>
        <div class="pd-info" id="pd-info"></div>
      </div>`;

    const stage = mount.querySelector('#pd-stage');
    const caption = mount.querySelector('#pd-caption');
    const info = mount.querySelector('#pd-info');

    function setCaption(pid) {
      if (!pid || !PARTS[pid]) {
        caption.className = 'pd-caption';
        caption.textContent = t('hoverHint', lang);
        return;
      }
      const p = PARTS[pid];
      caption.className = 'pd-caption cat-' + p.cat;
      caption.innerHTML = `<strong>${escapeHtml(tr(p.name, lang))}</strong>${escapeHtml(tr(p.desc, lang))}`;
    }

    function applyHighlight() {
      stage.setAttribute('data-hl', hl);
      mount.querySelectorAll('.pd-chip').forEach(c => c.classList.toggle('active', c.getAttribute('data-hl') === hl));
      const m = MODELS[sel];
      if (hl !== 'all' && !stage.querySelector(`[data-part="${hl}"]`)) {
        const note = (m.noPart && m.noPart[hl]) || t(hl === 'pos' ? 'noPos' : hl === 'neg' ? 'noNeg' : 'noSpace', lang);
        caption.className = 'pd-caption cat-' + (hl === 'space' ? 'space' : hl);
        caption.innerHTML = tr(note, lang);
      } else {
        setCaption(null);
      }
    }

    function show(i) {
      sel = ((i % MODELS.length) + MODELS.length) % MODELS.length;
      lastModel = sel;
      seen.add(sel);
      splitCount = 0;
      const m = MODELS[sel];
      mount.querySelectorAll('.pd-tl-btn').forEach((b, k) => {
        b.classList.toggle('active', k === sel);
        b.classList.toggle('seen', seen.has(k));
        b.setAttribute('aria-selected', k === sel ? 'true' : 'false');
      });
      stage.innerHTML = atomSvg(m.id, { labels: true, lang });
      anim.add(stage.querySelector('svg'));
      const factKeys = ['divisible', 'positive', 'electrons', 'space'];
      const factLabel = { divisible: 'factDivisible', positive: 'factPositive', electrons: 'factElectrons', space: 'factSpace' };
      info.innerHTML = `
        <h3>${escapeHtml(tr(m.name, lang))}</h3>
        <div class="pd-who">${m.year} · ${escapeHtml(tr(m.who, lang))}</div>
        <p class="pd-desc">${tr(m.desc, lang)}</p>
        <dl class="pd-facts">
          ${factKeys.map(k => `<div class="pd-fact"><dt>${escapeHtml(t(factLabel[k], lang))}</dt><dd>${escapeHtml(tr(m.facts[k], lang))}</dd></div>`).join('')}
        </dl>
        <div class="pd-why"><strong>${escapeHtml(t('whyLabel', lang))}</strong>${escapeHtml(tr(m.why, lang))}</div>
        ${m.id === 'solid' ? `<div style="margin-top:.8rem"><button type="button" class="pd-btn" data-act="split">${escapeHtml(t('splitBtn', lang))}</button><div class="pd-splitmsg" id="pd-splitmsg"></div></div>` : ''}`;
      applyHighlight();
    }

    // events
    mount.querySelectorAll('.pd-tl-btn').forEach(b => b.addEventListener('click', () => { stopTour(); show(Number(b.getAttribute('data-i'))); }));
    mount.querySelectorAll('.pd-chip').forEach(c => c.addEventListener('click', () => { hl = c.getAttribute('data-hl'); applyHighlight(); }));

    function stopTour() {
      if (tourTimer) { clearInterval(tourTimer); tourTimer = null; }
      const b = mount.querySelector('[data-act="tour"]');
      if (b) { b.textContent = t('tour', lang); b.classList.remove('on'); }
    }
    mount.querySelector('[data-act="prev"]').addEventListener('click', () => { stopTour(); show(sel - 1); });
    mount.querySelector('[data-act="next"]').addEventListener('click', () => { stopTour(); show(sel + 1); });
    mount.querySelector('[data-act="tour"]').addEventListener('click', (e) => {
      if (tourTimer) { stopTour(); return; }
      e.currentTarget.textContent = t('tourStop', lang);
      e.currentTarget.classList.add('on');
      show(0);
      tourTimer = setInterval(() => {
        if (!mount.isConnected) { stopTour(); return; }
        if (sel >= MODELS.length - 1) { stopTour(); return; }
        show(sel + 1);
      }, 6500);
    });
    mount.querySelector('[data-act="pause"]').addEventListener('click', (e) => {
      anim.setPaused(!anim.isPaused());
      e.currentTarget.textContent = anim.isPaused() ? t('animPlay', lang) : t('animPause', lang);
    });

    // hover/tap any labelled part -> caption
    stage.addEventListener('mouseover', (e) => {
      const el = e.target.closest('[data-pid]');
      if (el && hl === 'all') setCaption(el.getAttribute('data-pid'));
    });
    stage.addEventListener('mouseleave', () => { if (hl === 'all') setCaption(null); });
    stage.addEventListener('click', (e) => {
      const el = e.target.closest('[data-pid]');
      if (el) setCaption(el.getAttribute('data-pid'));
    });

    // solid-sphere "try to split it"
    info.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act="split"]');
      if (!btn) return;
      const g = stage.querySelector('.pd-sphere');
      if (g) { g.classList.remove('pd-shake'); void g.getBoundingClientRect(); g.classList.add('pd-shake'); }
      const msgs = STRINGS.splitMsgs[lang];
      const box = info.querySelector('#pd-splitmsg');
      if (box) box.textContent = msgs[Math.min(splitCount, msgs.length - 1)];
      splitCount++;
    });

    show(sel);
    return {
      show,
      openFromOutside(i) { stopTour(); show(i); mount.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    };
  }

  // ---------------------------------------------------------------- section 1: side by side
  function mountSideBySide(mount, lang, anim, onOpen) {
    const sym = { y: '✓', n: '✗', p: '~' };
    mount.innerHTML = `
      <p class="pd-intro">${t('s1Intro', lang)}</p>
      <div class="pd-legend">
        <strong>${escapeHtml(t('legendTitle', lang))}</strong>
        <span class="pd-key"><i style="background:#dc2626"></i>${escapeHtml(t('legendPos', lang))}</span>
        <span class="pd-key"><i style="background:#2563eb"></i>${escapeHtml(t('legendNeg', lang))}</span>
        <span class="pd-key"><i style="background:#94a3b8"></i>${escapeHtml(t('legendNeutral', lang))}</span>
        <span class="pd-key"><i style="background:#2ec4b6;opacity:.5"></i>${escapeHtml(t('legendSpace', lang))}</span>
      </div>
      <div class="pd-grid">
        ${MODELS.map((m, i) => `
          <div class="pd-card">
            ${atomSvg(m.id, { lang })}
            <div class="pd-card-year">${m.year} · ${escapeHtml(tr(m.who, lang))}</div>
            <div class="pd-card-name">${escapeHtml(tr(m.name, lang))}</div>
            <div class="pd-card-big">${escapeHtml(tr(m.big, lang))}</div>
            <div class="pd-card-why">${escapeHtml(tr(m.why, lang))}</div>
            <button type="button" class="pd-btn" data-open="${i}">${escapeHtml(t('openInExplorer', lang))}</button>
          </div>`).join('')}
      </div>
      <h4 class="pd-h4">${escapeHtml(t('cmpTitle', lang))}</h4>
      <div class="pd-table-wrap">
        <table class="pd-cmp">
          <thead><tr><th>${escapeHtml(t('cmpModel', lang))}</th>${STRINGS.cmpCols[lang].map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
          <tbody>
            ${MODELS.map(m => `<tr><td>${escapeHtml(tr(m.short, lang))} <span style="font-weight:400;color:#5a6475">(${m.year})</span></td>${m.cmp.map(v => `<td class="pd-${v}">${sym[v]}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="pd-note">${escapeHtml(t('cmpNote', lang))}</p>`;
    mount.querySelectorAll('svg.pd-svg').forEach(svg => anim.add(svg));
    mount.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => onOpen(Number(b.getAttribute('data-open')))));
  }

  // ---------------------------------------------------------------- section 2: which model am I
  function mountMatchGame(mount, lang) {
    // Deterministic shuffle of clue order so it isn't just chronological.
    const order = [3, 0, 5, 1, 4, 2];
    let selected = null;
    const solved = {}; // clueIndex -> true

    mount.innerHTML = `
      <p class="pd-intro">${t('s2Intro', lang)}</p>
      <div class="pd-bank">
        ${MODELS.map((m, i) => `<button type="button" class="pd-tile" data-model="${m.id}">${atomSvg(m.id, { lang })}<span>${escapeHtml(tr(m.short, lang))}</span></button>`).join('')}
      </div>
      <div class="pd-status" id="pd-match-status">${escapeHtml(t('pickClue', lang))}</div>
      <div id="pd-clues">
        ${order.map((ci, n) => `<div class="pd-clue" data-clue="${ci}"><span class="pd-clue-num">${n + 1}</span><span class="pd-clue-text">${escapeHtml(tr(CLUES[ci].text, lang))}</span><span class="pd-clue-ans"></span></div>`).join('')}
      </div>`;
    mount.querySelectorAll('.pd-tile svg').forEach(svg => stepAtom(svg, 1.3)); // static thumbnails, frozen at a pleasant pose

    const status = mount.querySelector('#pd-match-status');
    function setStatus(txt, cls) { status.textContent = txt; status.className = 'pd-status' + (cls ? ' ' + cls : ''); }
    function doneCount() { return Object.keys(solved).length; }

    mount.querySelectorAll('.pd-clue').forEach(el => el.addEventListener('click', () => {
      const ci = Number(el.getAttribute('data-clue'));
      if (solved[ci]) return;
      selected = ci;
      mount.querySelectorAll('.pd-clue').forEach(c => c.classList.toggle('selected', c === el));
      setStatus(t('matchProgress', lang, doneCount()));
    }));
    mount.querySelectorAll('.pd-tile').forEach(tile => tile.addEventListener('click', () => {
      if (selected === null) { setStatus(t('pickClue', lang), 'bad'); return; }
      const mid = tile.getAttribute('data-model');
      if (CLUES[selected].model === mid) {
        solved[selected] = true;
        const row = mount.querySelector(`.pd-clue[data-clue="${selected}"]`);
        row.classList.remove('selected'); row.classList.add('solved');
        row.querySelector('.pd-clue-ans').textContent = '✓ ' + tr(MODEL_BY_ID[mid].name, lang);
        tile.disabled = true;
        selected = null;
        setStatus(doneCount() === CLUES.length ? t('matchDone', lang) : t('matchGood', lang, tr(MODEL_BY_ID[mid].name, lang)), 'good');
      } else {
        tile.classList.remove('wrong'); void tile.offsetWidth; tile.classList.add('wrong');
        setStatus(t('tryAgain', lang), 'bad');
      }
    }));
  }

  // ---------------------------------------------------------------- section 3: label the parts
  function mountLabelGame(mount, lang, anim) {
    let round = 0, firstTry = 0, tried = false;

    function renderRound() {
      if (round >= LABEL_ROUNDS.length) {
        mount.innerHTML = `
          <div class="pd-lg pd-summary">
            <div class="pd-score">${firstTry} / ${LABEL_ROUNDS.length}</div>
            <p>${escapeHtml(t('labelDone', lang, firstTry, LABEL_ROUNDS.length))}</p>
            <button type="button" class="pd-next-btn" id="pd-lg-again">${escapeHtml(t('labelAgain', lang))}</button>
          </div>`;
        mount.querySelector('#pd-lg-again').addEventListener('click', () => { round = 0; firstTry = 0; renderRound(); });
        return;
      }
      const r = LABEL_ROUNDS[round];
      const m = MODEL_BY_ID[r.model];
      tried = false;
      mount.innerHTML = `
        <p class="pd-intro">${t('s3Intro', lang)}</p>
        <div class="pd-lg">
          <div class="quiz-question-count">${escapeHtml(t('labelRound', lang, round + 1, LABEL_ROUNDS.length))}</div>
          <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${Math.round(round / LABEL_ROUNDS.length * 100)}%"></div></div>
          <p class="quiz-prompt">${escapeHtml(t('labelQ', lang, tr(m.name, lang)))}</p>
          <div class="pd-stagebox">${atomSvg(r.model, { lang })}</div>
          <div style="margin-top:.8rem" id="pd-opts">
            ${r.options.map((pid, i) => `<button type="button" class="pd-opt" data-i="${i}">${escapeHtml(tr(PARTS[pid].name, lang))}</button>`).join('')}
          </div>
          <div class="pd-feedback" id="pd-lg-fb" style="display:none"></div>
          <button type="button" class="pd-next-btn" id="pd-lg-next" style="display:none">${escapeHtml(t('nextQuestion', lang))}</button>
        </div>`;
      const svg = mount.querySelector('svg.pd-svg');
      anim.add(svg);
      svg.querySelectorAll(`[data-pid="${r.pid}"]`).forEach(el => el.classList.add('pd-target'));
      const fb = mount.querySelector('#pd-lg-fb');
      const nextBtn = mount.querySelector('#pd-lg-next');
      mount.querySelectorAll('.pd-opt').forEach(btn => btn.addEventListener('click', () => {
        const i = Number(btn.getAttribute('data-i'));
        if (i === r.correct) {
          if (!tried) firstTry++;
          mount.querySelectorAll('.pd-opt').forEach(b => { b.disabled = true; });
          btn.classList.add('ok');
          const p = PARTS[r.pid];
          fb.style.display = 'block'; fb.className = 'pd-feedback correct';
          fb.innerHTML = `${escapeHtml(t('correctPrefix', lang))} <strong>${escapeHtml(tr(p.name, lang))}</strong> — ${escapeHtml(tr(p.desc, lang))}`;
          nextBtn.style.display = 'inline-block';
        } else {
          tried = true;
          btn.classList.add('no'); btn.disabled = true;
        }
      }));
      nextBtn.addEventListener('click', () => { round++; renderRound(); });
    }
    renderRound();
  }

  // ---------------------------------------------------------------- quiz (graded)
  function renderQuiz(mount, ctx) {
    const progress = ctx.getProgress();
    if (progress && progress.status === 'completed') { renderQuizSummary(mount, ctx); return; }
    const answers = (progress && progress.answers) || [];
    if (answers.length >= QUESTIONS.length) { finishQuiz(mount, ctx, answers); return; }
    renderQuizQuestion(mount, ctx, answers, answers.length);
  }

  function renderQuizQuestion(mount, ctx, answersSoFar, index) {
    const lang = getLang();
    const q = QUESTIONS[index];
    const pct = Math.round((index / QUESTIONS.length) * 100);
    mount.innerHTML = `
      <div class="quiz-question-count">${escapeHtml(t('questionCount', lang, index + 1, QUESTIONS.length))}</div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
      <p class="quiz-prompt">${escapeHtml(tr(q.prompt, lang))}</p>
      <div id="pd-answer-area"></div>
      <div id="pd-feedback-area"></div>
      <button type="button" class="pd-next-btn" id="pd-next-btn" style="display:none;">${escapeHtml(t('nextQuestion', lang))}</button>`;
    const answerArea = mount.querySelector('#pd-answer-area');
    const feedbackArea = mount.querySelector('#pd-feedback-area');
    const nextBtn = mount.querySelector('#pd-next-btn');
    let submitted = false;

    answerArea.innerHTML = q.choices.map((c, i) => `<button type="button" class="pd-choice" data-choice="${i}">${escapeHtml(tr(c, lang))}</button>`).join('');

    function submit(response, btnEl) {
      if (submitted) return;
      submitted = true;
      const correct = response === q.correct;
      answerArea.querySelectorAll('.pd-choice').forEach(el => {
        el.disabled = true;
        const val = Number(el.getAttribute('data-choice'));
        if (val === q.correct) el.classList.add('selected-correct');
        else if (el === btnEl) el.classList.add('selected-incorrect');
      });
      feedbackArea.innerHTML = `<div class="pd-feedback ${correct ? 'correct' : 'incorrect'}">${correct ? escapeHtml(t('correctPrefix', lang)) : escapeHtml(t('incorrectPrefix', lang))} ${escapeHtml(tr(q.explanation, lang))}</div>`;
      nextBtn.style.display = 'inline-block';
      const answers = answersSoFar.concat([{ questionId: q.id, response, correct }]);
      ctx.saveProgress({ status: 'in_progress', score: answers.filter(a => a.correct).length, totalQuestions: QUESTIONS.length, answers });
    }
    answerArea.querySelectorAll('.pd-choice').forEach(btn => btn.addEventListener('click', () => submit(Number(btn.getAttribute('data-choice')), btn)));
    nextBtn.addEventListener('click', () => renderQuiz(mount, ctx));
  }

  async function finishQuiz(mount, ctx, answers) {
    await ctx.saveProgress({ status: 'completed', score: answers.filter(a => a.correct).length, totalQuestions: QUESTIONS.length, answers });
    renderQuizSummary(mount, ctx);
  }

  function renderQuizSummary(mount, ctx) {
    const lang = getLang();
    const progress = ctx.getProgress();
    const score = progress ? progress.score : 0;
    mount.innerHTML = `
      <div class="pd-summary">
        <div class="pd-score">${score} / ${QUESTIONS.length}</div>
        <p>${escapeHtml(t('summaryText', lang))}</p>
        <button type="button" class="pd-retake-btn" id="pd-retake-btn">${escapeHtml(t('retakeQuiz', lang))}</button>
      </div>`;
    mount.querySelector('#pd-retake-btn').addEventListener('click', async () => {
      await ctx.saveProgress({ status: 'in_progress', score: 0, totalQuestions: QUESTIONS.length, answers: [] });
      renderQuiz(mount, ctx);
    });
  }

  window.Activities = window.Activities || {};
  window.Activities['atomic-models'] = { render };
})();

</script>
